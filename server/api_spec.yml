        description: always [] (the official captures also carry []).
        value: []
      - name: replayDescriptor0
        row: ReplayDescriptorRow
        description: the kind-0 replay upload descriptor (or the empty row when the
          title does not upload).
      - name: replayDescriptor1
        row: ReplayDescriptorRow
        description: the kind-1 descriptor (A4); the empty row elsewhere.
      - name: extra
        description: always null (officially null too).
      - name: items
        description: always [] (officially []).
        value: []
      - name: challenges
        description: always [] (officially [] in every capture).
        value: []
      - name: eventChallenges
        description: always [] (officially []).
        value: []
      - name: clientUpdates
        description: always [] here; the official A4 rated reports carry rows [[profileID,
          id, 1, 0, ts, ts, ts]].
        value: []
      - name: slots
        value: []
      - name: extra2
        value: []
      - name: zero
        description: constant 0.
        value: 0
      - name: extra3
        description: always null.
      - name: counters
        description: always [] in the captures.
        value: []
      - name: members
