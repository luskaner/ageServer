openapi: 3.2.1
info:
  title: Age Server REST API
  version: 2.1.0
  description: "OpenAPI specification of Age Server, the local reimplementation of\
    \ the Age\nof Empires online services: the game client API (`/game`), the public\
    \ API\n(`/community`), the Age of Empires hosts (`api.ageofempires.com`: the\n\
    embedded mods API and its diagnostics), the CDN status placeholders\n(`cdn.ageofempires.com`)\
    \ and the PlayFab endpoints used by Age of Empires\nIV and Age of Mythology: Retold.\n\
    \n## Fidelity\n\nEvery operation carries two extensions:\n\n* `x-fidelity` — `Faithful`\
    \ keeps the wire shape and the observable\n  semantics of the official service;\
    \ `Partial` keeps the envelope but\n  serves reduced data (static catalogue, stub,\
    \ subset of fields or flow);\n  `Different` is a deliberate, documented deviation;\
    \ `Own` is an endpoint\n  with no official counterpart.\n* `x-games` — the titles\
    \ the operation is registered for (`A1` Age of\n  Empires DE, `A2` Age of Empires\
    \ II DE, `A3` Age of Empires III DE, `A4`\n  Age of Empires IV, `AoM` Age of Mythology:\
    \ Retold).\n\nBeing faithful never means byte-identical: identifiers, names, dates\
    \ and\ncounters are local.\n\n## Positional arrays\n\n`/game` uses `application/x-www-form-urlencoded`\
    \ bodies and **positional\nJSON arrays**: the meaning of a slot comes from its\
    \ index, not from a key,\nand OpenAPI objects cannot express that. The operations\
    \ declare\n`x-response-positions`: a list with one entry per slot, in order, each\n\
    entry being an object with the slot `name`, a `description` of its JSON\ntype\
    \ and semantics, its expected `value` when it is a constant, and the\n`row` it\
    \ repeats when it is an array (the row is documented once, slot by\nslot, in `#/components/schemas/<row>`).\
    \ The response schema itself is\nalways `Positional`. The `/community` API uses\
    \ named-field JSON objects\nand PlayFab its own `{code, status, data}` envelope,\
    \ except where their\nrows reuse the same positional encodings.\n\n## Requests\n\
    \n* GET: fields are bound from the query string.\n* POST: fields are bound from\
    \ the `x-www-form-urlencoded` body; with a\n  `Content-Type: application/json`\
    \ request the body is decoded as JSON.\n  Unknown keys are ignored, so the fields\
    \ the official clients send and\n  the handlers never read (always listed in each\
    \ description) do not fail\n  the call.\n* Every game-tree and PlayFab-tree request\
    \ body is capped at 1 MiB except\n  the streaming upload trees (`/cloudfiles/`,\
    \ `/api/v4/`,\n  `/api/MatchContent/`), which are bounded by their own configured\
    \ limits.\n* Responses are `Content-Type: application/json;charset=utf-8` with\
    \ a\n  trailing newline (the raw signed catalogue bodies are the exceptions).\n\
    \n## Authentication\n\n* `/game`: the local `sessionID`, sent in the form body\
    \ or query string\n  and minted by `POST /game/login/platformlogin`. It is not\
    \ a verified\n  Steam or Xbox token; a missing or unknown one gets\n  `401 Unauthorized`\
    \ (plain text) from the session middleware. The routes\n  the middleware exempts\
    \ declare `security: []`:\n  `/game/login/platformlogin`, `/game/news/getNews`,\n\
    \  `/game/Challenge/getChallenges`, `/game/item/getItemBundleItemsJson`,\n  `/game/msstore/getStoreTokens`,\
    \ `/wss/` and every `/cloudfiles/` path.\n* `/community`: anonymous, like the\
    \ official service; the optional\n  `title` query parameter must match the listener's\
    \ title or the answer\n  is a code-2 result envelope.\n* `api.ageofempires.com`:\
    \ the embedded mods library authenticates with the\n  Steam ticket (`Authorization:\
    \ Steam1.0 <ticket>`), the Xbox ticket\n  (`XBL3.0`) or the website cookie; its\
    \ operations are listed in the\n  library's own OpenAPI (see externalDocs).\n\
    * PlayFab: with the exceptions noted per operation\n  (`LoginWithSteam`, `LoginWithCustomID`,\
    \ `ListPartyQosServers`,\n  `WriteTelemetryEvents`, `/static/`), every request\
    \ must carry the header\n  `X-Entitytoken` (AoM) or `X-Sessionticket` (A4) with\
    \ the session token\n  a login operation returned; a missing or unknown token\
    \ is answered\n  with HTTP 200 and a `Unauthorized` error envelope, the way the\
    \ official\n  service answers (`X-Reporterrorassuccess: true`).\n\n## Hosts\n\n\
    Which host serves which tree (`<tld>` is `.com`):\n\n* Game hosts, never proxied,\
    \ `/game` + `/community` + `/cloudfiles`:\n  `aoe-api.reliclink.com` and `aoe-api.worldsedgelink.com`\
    \ for every\n  title; the release hosts `pb-live-release<N>-api.worldsedgelink.com`\n\
    \  (A2), `aoeliverelease1/2-api.worldsedgelink.com` and\n  `dr-activerelease<N>-api.worldsedgelink.com`\
    \ (A4),\n  `andromeda-live-release<N>-api.worldsedgelink.com` and\n  `athens-live-api.worldsedgelink.com`\
    \ (AoM), plus the A2 macOS hosts\n  `arthurlive-api.worldsedgelink.com` and\n\
    \  `arthurlive-release<N>-api.worldsedgelink.com`. `<N>` also extends to\n  further\
    \ releases when they resolve, so a new official release host\n  resolves to this\
    \ server without a configuration change.\n* `api.ageofempires.com` (and `api-dr.ageofempires.com`\
    \ for A4): the\n  embedded mods library and its diagnostics.\n* `cdn.ageofempires.com`:\
    \ the two `*-server-status.json` placeholders.\n* `c15f9.playfabapi.com` (AoM)\
    \ and `ed603.playfabapi.com` (A4): PlayFab.\n\n## Delegated surface\n\nThe Age\
    \ of Empires hosts mount the embedded `github.com/luskaner/ageAPIServer`\nlibrary\
    \ (published module `v1.1.0+`), which owns `/api/v4/**`,\n`/api/v1/**`, `/Poll/**`\
    \ and `/api/MatchContent/**`. Its authoritative\nOpenAPI is `api_spec.yml` at\
    \ the root of that project, and a deployment\nexposes it at `GET /openapi.yml`;\
    \ this document does not repeat those\noperations or their schemas. When the `[Api]\
    \ Enabled` configuration is\nfalse the whole tree is off: those paths answer 404\
    \ instead of the\nembedded library or the official service. Two operational routes\
    \ of the\nlibrary are exposed under this server's namespace as rewrites rather\
    \ than\nsecond registrations: the liveness probe `GET /test/api` (rewritten to\n\
    the library's `/test`) and the certificate `GET /cacert.pem/api`\n(rewritten to\
    \ the library's `/cacert.pem`); both answer 404 when the API\ntree is disabled,\
    \ and so does the library's certificate route itself,\nbecause this server terminates\
    \ TLS. This server's process-wide probes are\n`GET /test/root` (announcement)\
    \ and `GET /cacert.pem/root` (CA\ncertificate), served on every host, and its\
    \ signing key at\n`GET /sigkey.der`.\n\n## Local answer or official service\n\n\
    Which side answers a request depends on the host and, for the library\nsurface,\
    \ on the client:\n\n* Game hosts (all the `*.worldsedgelink.com`, `reliclink.com`\
    \ and\n  `arthurlive*` hosts): every path they receive is answered locally,\n\
    \  including `/api/MatchContent/**` and the `/cloudfiles/` store. No\n  upstream\
    \ proxy exists for them.\n* PlayFab hosts (`c15f9`/`ed603.playfabapi.com`): always\
    \ local. No\n  upstream proxy is created for them.\n* `api.ageofempires.com` /\
    \ `api-dr.ageofempires.com`: a reverse proxy to\n  the official service exists\
    \ when the server has internet access and the\n  host name resolves. A request\
    \ goes upstream unless it is one of the\n  paths answered on every host (`/test/root`,\
    \ `/cacert.pem/root`,\n  `/sigkey.der` and, on Windows, `POST /shutdown`) or one\
    \ of the two\n  local diagnostics of the API host (`/test/api`, `/cacert.pem/api`,\
    \ both\n  never forwarded), and the mods and MatchContent trees\n  follow a client\
    \ rule: a request with a decodable `Steam1.0` ticket\n  (what the emulated clients\
    \ send) selects the local library, while no\n  ticket, another scheme or an opaque\
    \ (genuine Steam) ticket is treated\n  as an official client and forwarded; without\
    \ internet the local library\n  answers instead. `/textmoderation`, captured in\
    \ `api_aoe2` and\n  `api_unknown`, is **not** intercepted: it follows this general\
    \ proxy\n  rule (upstream when the proxy exists, 404 otherwise).\n* `cdn.ageofempires.com`:\
    \ the two `*-server-status.json` placeholders are\n  local; every other path goes\
    \ upstream when the proxy exists, and 404\n  otherwise.\n\n`Authentication` is\
    \ a separate decision: with `cached` or `online`, only\n`POST /game/login/platformlogin`\
    \ is validated against the official\nservice (or its 30-day cached answer, or\
    \ against a previously validated\nticket when offline) before the local session\
    \ is created; it does not\nchange where the other routes go.\n\n## Signatures\n\
    \nSeveral catalogues travel with a `dataSignature` the client verifies with\n\
    an RSA-2048 SPKI it carries in its own process. The scheme is the\nRelicLink variant\
    \ of PKCS#1 v1.5 with the bare SHA-512 digest (no ASN.1\nDigestInfo) and maximum-length\
    \ padding: the body is signed with the\ndecimal ASCII of `crc32(body-with-the-signature-emptied)`\
    \ as the input\ntag, producing a 344-character base64 string. The key pair\n(`sigkey.pem`\
    \ private, `sigkey.der` public) is generated next to the TLS\ncertificates; `GET\
    \ /sigkey.der` serves the public half, and the game\nprocess must be pointed at\
    \ it (FakeSignature.dll) — without that, it\nverifies against Microsoft's key\
    \ and rejects anything signed here. With\n`[Sign] Enabled=true` the catalogues\
    \ are re-signed with this key at\nstartup; when it is false the captured body\
    \ and signature are replayed\nverbatim. For short-parameter requests the signature\
    \ is served raw\n(`POST /game/item/signItems`). The `[Sign] PlatformUserIdExceptions`\n\
    list inverts the setting per user, but only the login route resolves a\nuser,\
    \ so the exception can be observed on that route alone.\n\n## Errors\n\n* HTTP\
    \ `401 Unauthorized` (plain text, from the session middleware) for a\n  missing\
    \ or unknown `sessionID`.\n* `500` (plain text) `signed asset was not loaded:\
    \ <name>` when a\n  title ships no copy of a signed catalogue.\n* PlayFab errors\
    \ keep HTTP 200 and carry `{code, status, errorCode,\n  error, errorMessage}`\
    \ in the body.\n* Positional `[2, ...]` result codes are the functional errors\
    \ of the\n  game tree; the constant or per-error content is documented per\n \
    \ operation.\n\n## Known gaps\n\nRoutes captured from the official service that\
    \ this server does not\nregister (they answer 404 after the session check, or\
    \ never appear in\nthe router): `GET|POST /game/CommunityEvent/getEventChallengeProgress`\n\
    (captured in `aoe2*` and `aoe4`), `POST\n/game/CommunityEvent/updateEventChallengeProgressBatched`\
    \ (`aoe4`),\n`POST /game/relationship/acceptFriend` (`aoe4`, `aom`),\n`POST /game/clan/apply`\
    \ (`aoe2*`), `GET /game/clan/getClan` and\n`GET /game/clan/getClanInfoFull` (`aoe2-internal`,\
    \ `aom`), and\n`GET /game/cloud/getFileURL` for AoM (captured 110× in `aom`, though\
    \ the\ntitle is not registered for it).\n\n## Notification socket\n\nThe WebSocket\
    \ notification socket (`GET /wss/`) is documented in\n`asyncapi_spec.yml`, next\
    \ to this file: it pushes, as\n`[messageId, action, userId, payload]` frames,\
    \ the events the REST calls\nof other clients produce, and the same frames queue\
    \ on the session when\nthe recipient has no live socket, served by\n`POST /game/login/readSession`.\n\
    \n## Client versions\n\nA few encodings change with the `clientLibVersion` the\
    \ client sends at\nlogin: sanitized alias in profile rows (`>= 190`), a trailing\
    \ `-1` in the\nlogin `selectProfile` (`>= 193`), and the AoE III \"Baltic Powers\"\
    \nadvertisement/leaderboard row formats (`>= 194`). The sections below say\nwhich\
    \ shape each version gets.\n"
  contact:
    name: luskaner
    url: https://github.com/luskaner
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
externalDocs:
  description: Authoritative OpenAPI of the embedded library, which owns the mods
    tree, the polls and /api/MatchContent on the Age of Empires hosts.
  url: https://github.com/luskaner/ageAPIServer
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://aoe-api.worldsedgelink.com
  description: Game host (A1, A2, A3, A4; release hosts per description); also serves
    /community
- url: https://andromeda-live-release21-api.worldsedgelink.com
  description: Game host (AoM release family; also athens-live-api.worldsedgelink.com);
    also serves /community with title=athens
- url: https://api.ageofempires.com
  description: Age of Empires API hosts (api-dr.ageofempires.com for AoE4) — embedded
    library and diagnostics
- url: https://cdn.ageofempires.com
  description: Server status placeholders; everything else is proxied upstream
- url: https://ed603.playfabapi.com
  description: PlayFab (A4); AoM uses c15f9.playfabapi.com
tags:
- name: Game
  description: Game client API (positional arrays)
- name: Community
  description: Public object-shaped API over the same data
- name: PlayFab
  description: 'PlayFab endpoints used by A4 and AoM. The token gate wraps the whole

    host, so every path that is not one of the four anonymous operations

    or /static answers the 401 envelope over HTTP 200 — including paths

    the official istio front answers 404 for with an empty body (the

    captured GET /test and POST /game/login/platformlogin probes).

    '
- name: CDN
  description: Server status placeholders
- name: Ops
  description: Local operational endpoints
components:
  securitySchemes:
    GameSession:
      type: apiKey
      in: query
      name: sessionID
      description: 'Local session identifier created by `POST /game/login/platformlogin`.

        The client may send it in the query string or in the form body; the

        API key scheme is used because OpenAPI has no "form body credential"

        kind.

        '
    PlayFabEntityToken:
      type: apiKey
      in: header
      name: X-Entitytoken
      description: PlayFab session token (AoM), returned by LoginWithSteam.
    PlayFabSessionTicket:
      type: apiKey
      in: header
      name: X-Sessionticket
      description: PlayFab session ticket (A4), returned by LoginWithCustomID.
    SteamAuth:
      type: http
      scheme: bearer
      bearerFormat: Steam1.0
      description: Steam ticket sent by the game clients to the mods API
    XblAuth:
      type: http
      scheme: bearer
      bearerFormat: XBL3.0
      description: Xbox token of the Microsoft Store clients (`XBL3.0 x=<puid>;<XToken>`)
    WebSession:
      type: apiKey
      in: cookie
      name: .AgeOfEmpiresServices
      description: Website session cookie used by www.ageofempires.com
  parameters:
    CommunityTitle:
      name: title
      in: query
      required: false
      schema:
        type: string
      description: 'The title this listener serves (age1-age4, athens). Absent: the

        listener''s own game. A mismatched or unknown title answers the

        code-2 result envelope over HTTP 200 — where the official service

        answers 404 with no body (foreign title) or 400 with an HTML error

        page (missing title on the andromeda host).

        '
  responses:
    GameOK:
      description: Positional JSON array; the slot order is in the operation's `x-response-positions`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Positional'
    Unauthorized:
      description: Missing or unknown session credential.
      content:
        text/plain:
          schema:
            type: string
            examples:
            - Unauthorized
    NotFound:
      description: The resource does not exist.
    BadRequest:
      description: The request could not be parsed or is not valid.
    SignedAssetMissing:
      description: The title ships no copy of the signed catalogue (plain text, status
        500).
      content:
        text/plain:
          schema:
            type: string
            examples:
            - 'signed asset was not loaded: itemDefinitions.json'
  schemas:
    Positional:
      type: array
      description: 'Positional response of the game client. Every slot means what
        the

        operation''s `x-response-positions` entry at the same index says: an

        entry has `name`, `description`, the constant `value` when the slot

        never changes, and, when the slot is an array, the name of the schema

        its `row`s follow, documented in this file''s components.

        The first element is normally `resultCode` (0 success, 2 error).

        '
      items: {}
    GameProfileRow:
      type: array
      description: 'The identity row `EncodeProfileInfo` produces, 14 slots below

        client library 190 and 15 from there on (A1 always uses the 14-slot

        form). Ids, the alias and per-title constants are local; `xp` and

        `level` are constants because the server has no progression source,

        and the official service sends the real account progression.

        '
      prefixItems:
      - type: integer
        description: 'entityVersion: constant (officially a per-profile counter).'
      - type: integer
        description: profileId.
      - type: string
        description: 'name: `/steam/<id>` or `/xboxlive/<id>`.'
      - type:
        - string
        - 'null'
        description: 'metaData: avatar metadata set by setAvatarMetadata.'
      - type: string
        description: alias.
      - type: string
        description: 'sanitizedAlias: same as alias (only present from client library
          190).'
      - type: string
        description: 'clanName: always empty (no clan model).'
      - type: integer
        description: personalStatGroupID.
      - type: integer
        description: 'xp: always 0.'
      - type: integer
        description: 'level: always 9999.'
      - type: integer
        description: 'leaderboardRegionID: 0 (Steam) or 3 (Xbox).'
      - type: 'null'
        description: 'banInfo: never populated.'
      - type: string
        description: platformUserID.
      - type: integer
        description: 'accountType: 3 (Steam) or 9 (Xbox).'
      - type: array
        description: 'linkedPlatformAccounts: always empty.'
    PresenceSuffixRow:
      type: array
      description: 'Presence appended after a profile row by the presence-aware encoders

        (relationships, FindProfiles*, Presence frames).

        '
      prefixItems:
      - type: integer
        description: 'presenceID: the id set by setPresence (1 online at login).'
      - type:
        - string
        - 'null'
        description: 'presenceLocalized: label from presenceData.json (officially
          localized per client language) or null.'
      - type: array
        description: 'presencePropertyInfo: [[propertyDefID, value], ...] set by setPresenceProperty.'
    AccountInfoRow:
      type: array
      description: The platform-account block of the platformlogin response.
      prefixItems:
      - type: integer
        description: profileId.
      - type: string
        description: 'accountName: `/steam/<id>` or `/xboxlive/<id>`.'
      - type: integer
        description: 'accountType: 3 (Steam) or 9 (Xbox).'
      - type: integer
        description: 'ssoID: always -1 (no single sign-on).'
      - type: integer
        description: 'ssoStatus: always 0.'
      - type: string
        description: 'country: always "en" (officially the account''s country).'
      - type: string
        description: 'currency: always "eur" (officially the account''s currency).'
      - type: integer
        description: 'spamAllowed: 2 (allow all).'
      - type: 'null'
        description: metaData.
    AvatarStatRow:
      type: array
      description: Avatar statistics (setAvatarStatValues, selectProfile stats, GetAvatarStatForProfile).
      prefixItems:
      - type: integer
        description: statID (avatarstat definition id; AoM fixes STAT_GAUNTLET_REWARD_*).
      - type: integer
        description: profileID.
      - type: integer
        description: 'value (int64 on the wire: JSON number).'
      - type:
        - string
        - 'null'
        description: 'metadata: raw JSON the client holds or null.'
      - type: integer
        description: 'lastUpdated: unix seconds.'
    RelayServerRow:
      type: array
      description: 'One relay (battle) server of the platformlogin response. The

        official service returns ~9-12 Azure regions; this server returns the

        configured battle servers and, when none exist, a single-fashioned

        fallback `127.0.0.1`.

        '
      prefixItems:
      - type: string
        description: 'region: the configured region name ("westeurope", or a LAN GUID).'
      - type:
        - string
        - 'null'
        description: 'displayName: configured ("localhost" for the fallback); A1 omits
          this slot, A3/A4 send null.'
      - type: string
        description: IPv4 address (127.0.0.1 for the fallback).
      - type: integer
        description: battle server port (27012 fallback).
      - type: integer
        description: WebSocket port (27112 fallback).
      - type: integer
        description: out-of-band port (27212 fallback; slots 6 only for A2/A3/A4/AoM
          — A1 stops at 5).
    ClientSettingsRow:
      type: array
      description: One [key, value] pair of the platformlogin clientSettings block
        (config/<game>/login.json).
      prefixItems:
      - type: string
        description: setting key, e.g. RL_KEEPALIVE.
      - type: string
        description: setting value, verbatim from the catalog.
    GameError:
      type: array
      description: Positional error envelope.
      prefixItems:
      - type: integer
        description: resultCode (2)
      items: {}
    SelectProfileArray:
      type: array
      description: 'The `selectProfile` block of platformlogin. Slot 9 (`privacySettings`)

        is absent on A1; slot 10 (`extra`) appears from client library 193:

        A1 9 slots, A2 at library 190 10 slots, newer clients 11 slots.

        '
      prefixItems:
      - type: integer
        description: resultCode (0).
      - type: array
        description: 'profile: one GameProfileRow.'
        items: {}
      - type: array
        description: 'relationships: RelationshipsArray (8 slots).'
      - type: array
        description: 'leaderboardStats: filled for A2 and for AoE3 >= the Baltic Powers
          only; [] otherwise (the official service fills it for every modern title).'
      - type: array
        description: 'stats: AvatarStatRow list for the profile; null on A1 (officially
          []).'
        items: {}
      - type: 'null'
        description: clanInfo.
      - type: array
        description: 'clanMembershipRequests: always [].'
      - type: 'null'
        description: extendedData.
      - type: integer
        description: 'enableCrossplay: always 1.'
      - type: array
        description: 'privacySettings: [] (not sent to A1).'
      - type: integer
        value: -1
        description: 'extra: -1 (client library 193+ only).'
    RelationshipsArray:
      type: array
      description: 'The relationship answer shared by platformlogin''s selectProfile
        and

        getRelationships: 8 slots. Every connected user (except the caller)

        is listed as a friend or a last connection depending on the title —

        the server has no platform friendship model, and the official service

        lists real Steam/Xbox friends there.

        '
      prefixItems:
      - type: integer
        description: resultCode (0).
      - type: array
        description: 'friends: GameProfileRow + presence suffix rows; A1/A2 keep this
          slot empty and use the lastConnections slot.'
        items: {}
      - type: array
        description: 'friendRequests: always [].'
      - type: array
        description: 'incomingInvitations: always [].'
      - type: array
        description: 'outgoingInvitations: always [].'
      - type: array
        description: 'lastConnections: filled for A1/A2, empty for A3/A4/AoM.'
        items: {}
      - type: array
        description: 'ignored: always [].'
      - type: array
        description: 'blocked: always [].'
    ReplayDescriptorRow:
      type: array
      description: 'One replay upload descriptor of reportMatch / createOrReportSinglePlayer.

        Either filled (titled path under /cloudfiles) or the empty form.

        '
      prefixItems:
      - type: integer
        description: 'matchID (empty form: -1).'
      - type: string
        description: 'url: `http(s)://<host>/cloudfiles/replays/<matchID>/<kind|S_<matchID>>/<sha>.gz`
          ("" when empty).'
      - type: string
        description: host the URL belongs to ("" when empty).
      - type: string
        description: path below /cloudfiles ("" when empty).
      - type: integer
        description: 'uploader kind: 0 | 1 (multiplayer), 1 always for single player
          (0 when empty).'
      - type: string
        description: sas query string `sig=<credential>&se=<RFC3339>&sv=2019-02-02&sp=cw&sr=b`
          ("" when empty).
    StatGroupRow:
      type: array
      description: The stat-group row paired with leaderboard responses.
      prefixItems:
      - type: integer
        description: statGroupID (A1 uses the profile id, newer titles their own range).
      - type: string
        description: 'name: always empty.'
      - type: string
        description: 'metadata: always empty.'
      - type: integer
        description: 'type: 1 (player) — no clan stat groups exist.'
      - type: integer
        description: profileID of the single member.
    LeaderboardStatRow:
      type: array
      description: 'Leaderboard statistics row of the ranked ladders, 19 slots for
        the

        modern encoders; A1 (and AoE III below the Baltic Powers officially)

        uses a 16-slot legacy form whose last two entries are the string

        "{}" (counters) and the custom updates JSON, closing with

        lastMatchTime. Region/peak figures have no source here and are

        served as 0 / -1; on the official service they are real.

        '
      prefixItems:
      - type: integer
        description: statgroupID.
      - type: integer
        description: leaderboardID (A4 unrated 0; AoM -1).
      - type: integer
        description: wins.
      - type: integer
        description: losses.
      - type: integer
        description: 'streak: positive on a winning run, negative on a losing one.'
      - type: integer
        description: 'disputes: always 0.'
      - type: integer
        description: 'drops: always 0.'
      - type: integer
        description: 'ranking: -1 when unrated.'
      - type: integer
        description: 'rankTotal: local population; -1 unknown ladder, 0 empty.'
      - type: integer
        description: 'regionRanking: always -1 (no regional ladders).'
      - type: integer
        description: 'regionRankTotal: always -1.'
      - type: integer
        description: 'level: always 0.'
      - type: integer
        description: rating (1000 default / DefaultRating until matches move it).
      - type: integer
        description: 'lastMatchTime: unix seconds, 0 when never.'
      - type: integer
        description: highestRank (the game-tree row mirrors the ranking locally; the
          official row carries the real peak).
      - type: integer
        description: 'highestRankLevel: always 0.'
      - type: integer
        description: highestRating (mirrors the rating locally).
      - type: integer
        description: 'platformRank: always -1.'
      - type: integer
        description: 'platformRankTotal: always -1.'
      - type: string
        description: 'counters legacy form (A1): "{}" — check the operation''s note
          for which form is used.'
      - type: string
        description: 'custom updates legacy form (A1): "{}".'
      - type: integer
        description: lastMatchTime legacy form (A1).
    PeerRow:
      type: array
      description: 'One peer of a lobby. The internal advertisement address is a

        synthetic `10.0.11.N` space, exactly like the official deployments;

        on a LAN deployment it is routable only inside that LAN.

        '
      prefixItems:
      - type: integer
        description: advertisementID (match id in the party context).
      - type: integer
        description: profileID.
      - type: integer
        description: 'ranking: always -1.'
      - type: integer
        description: statGroupID.
      - type: integer
        description: raceID (civilization).
      - type: integer
        description: teamID (-1 when unset; A2/A4 leave -1, A1/A3/AoM carry the real
          slot).
      - type: string
        description: 'address: "/10.0.11.N" synthetic peer address.'
    AdvertisementRow:
      type: array
      description: 'One lobby. Modern titles (A2, A4, AoM, and A3 from client library

        194 "The Baltic Powers") use the 27-slot form; A3 below 194 uses a

        23-slot form without slots 2-4 and without the repeated description;

        A1 uses a 22-slot form that also drops the battle-server name slot.

        The password is never echoed, only its presence.

        '
      prefixItems:
      - type: integer
        description: '0: advertisementID.'
      - type: integer
        description: '1: platformSessionID (psnSessionID / Steam session, stored by
          updatePlatformSessionID).'
      - type:
        - string
        - integer
        description: '2: goodoldgameslobbyid: "0" (string locally; the current official
          captures send the number 0).'
      - type: string
        description: '3: platform session ID: always "" (A1 and A3 below 194: absent).'
      - type: string
        description: '4: platform match ID: always "" (A1 and A3 below 194: absent).'
      - type: string
        description: '5: xboxSessionId: "0" (A1-22 keeps this slot) or the Xbox session
          metadata JSON.'
      - type: integer
        description: 'next: hostProfileID.'
      - type: integer
        description: 'next: state: 0 open, 1 started.'
      - type: string
        description: 'next: description (27-slot form repeats it in the next slot).'
      - type: string
        description: 'next: description repeated (27-slot form only).'
      - type: integer
        description: 'next: visible 0/1.'
      - type: string
        description: 'next: mapName.'
      - type: string
        description: 'next: options: opaque base64+zlib block.'
      - type: integer
        description: 'next: passwordEnabled 0/1 (the password itself is never echoed).'
      - type: integer
        description: 'next: maxplayers.'
      - type: string
        description: 'next: slotinfo: opaque base64+zlib block.'
      - type: integer
        description: 'next: matchtype: 0 custom, 1/13 session/party, 19 matchmaking,
          A4 the pool id.'
      - type: array
        description: 'next: peers: PeerRow list.'
        items: {}
      - type: integer
        description: 'next: observer count.'
      - type: integer
        description: 'next: observermax: always 0 here (official 512 online, 0 LAN).'
      - type: integer
        description: 'next: isObservable 0/1.'
      - type: integer
        description: 'next: observerDelay (seconds).'
      - type: integer
        description: 'next: hasObserverPassword 0/1.'
      - type: integer
        description: 'next: lan: 0/1 (serviceType).'
      - type:
        - integer
        - 'null'
        description: 'next: startTime: unix seconds once started, null before.'
      - type: string
        description: 'next: relayRegion: region name or LAN GUID.'
      - type:
        - string
        - 'null'
        description: 'last in the 27-slot form: battleServerName: configured display
          name, null (A3/A4), or omitted (A1).'
    BattleServerAddress:
      type: array
      description: 'The battle server block embedded in host/startObserving answers.
        Ports

        are 0 slots until a battle server is configured; on a LAN deployment

        this carries the server the peers actually connect to, while the

        official answers describe Azure relay hosts.

        '
      prefixItems:
      - type: string
        description: IPv4 address (local interface address of the request; the official
          service answers "" for LAN lobbies).
      - type: integer
        description: battle server port (e.g. 27012).
      - type: integer
        description: WebSocket port (e.g. 27112).
      - type: integer
        description: out-of-band port (e.g. 27212; slot only for A2/A3/A4/AoM — A1
          stops at 3).
    MatchHistoryRow:
      type: array
      description: 'One match of getRecentMatchHistory (game tree). The counters and

        custom-update strings echo what reportMatch stored; "AUTOMATCH" as

        description marks rated games.

        '
      prefixItems:
      - type: integer
        description: matchHistoryID.
      - type: integer
        description: 'creatorProfileID: first reporter.'
      - type: string
        description: mapName.
      - type: integer
        description: maxplayers.
      - type: integer
        description: 'matchTypeID: the automatch pool when queued, fallback 26.'
      - type: string
        description: 'encodedOptions: opaque base64+zlib block.'
      - type: string
        description: 'encodedSlots: opaque base64+zlib block.'
      - type: string
        description: 'description: "AUTOMATCH" for rated matches.'
      - type: integer
        description: 'startGameTime: unix seconds.'
      - type: integer
        description: 'completionTime: unix seconds.'
      - type: integer
        description: 'observerTotal: always 0.'
      - type: array
        description: 'matchhistoryreportresults: MatchReportResultRow list.'
        items: {}
      - type: array
        description: 'matchhistoryitems: always [].'
      - description: 'matchurls: MatchUrlRow list.'
      - type: array
        description: 'matchVersionInfo: ["INVALID","INVALID","INVALID",0,0,0,0].'
        items: {}
      - description: 'memberstats: MatchMemberStatRow list.'
    MatchReportResultRow:
      type: array
      description: One player row of a match-history report result.
      prefixItems:
      - type: integer
        description: matchhistoryID.
      - type: integer
        description: profileID.
      - type: integer
        description: 'resultType: 0 loss, 1 win, 3 draw/incomplete.'
      - type: integer
        description: teamID.
      - type: integer
        description: raceID (civilization).
      - type: integer
        description: xpgained.
      - type: string
        description: 'counters: JSON object string, "{}" when empty (officially e.g.
          {"rankedMatch":0} on AoE3).'
      - type: string
        description: 'customUpdates: JSON object string with itemUpdates/challengeUpdates/eventChallengeUpdates/clientUpdates.'
      - type: integer
        description: 'matchstartdate: unix seconds.'
    MatchUrlRow:
      type: array
      description: 'One replay URL of a match row. The URL carries no SAS signature:
        the

        game calls getTempCredentials for the same key before downloading.

        '
      prefixItems:
      - type: integer
        description: uploader/creator profile id (the real uploader is not persisted).
      - type: string
        description: url below /cloudfiles (present only when replay storage is enabled).
      - type: integer
        description: length in bytes.
      - type: integer
        description: 'kind: 0 (classic) / 1 (AOE rec).'
    MatchMemberStatRow:
      type: array
      description: One ratings row of a match row.
      prefixItems:
      - type: integer
        description: matchHistoryID.
      - type: integer
        description: profileID.
      - type: integer
        description: raceID.
      - type: integer
        description: statGroupID.
      - type: integer
        description: teamID.
      - type: integer
        description: wins.
      - type: integer
        description: losses.
      - type: integer
        description: streak.
      - type: integer
        description: 'arbitration: 1.'
      - type: integer
        description: outcome.
      - type: integer
        description: 'oldRating: 1000 default until a rating exists.'
      - type: integer
        description: newRating.
      - type: integer
        description: 'reportType: 1.'
    ChallengeProgressRow:
      type: array
      description: 'One challenge progress record. The server is meant to run with

        everything unlocked, so the rows arrive completed; the official

        service returns pending progress.

        '
      prefixItems:
      - type: integer
        description: 'progressID: sequential id.'
      - type: integer
        description: definitionID (challenges.json).
      - type: integer
        description: 'completionCount: 1 completed.'
      - type: integer
        description: 'progress: 0.'
      - type:
        - integer
        - 'null'
        description: 'expiryTime: null (no challenge expires here).'
      - type:
        - integer
        - 'null'
        description: 'lastCompletedTime: unix seconds.'
      - type: integer
        description: 'assignedTime: unix seconds (lastCompleted > assigned, pending
          officially).'
    CommunityEventRow:
      type: array
      description: 'One event of the game-tree CommunityEvent answer. A4 carries its

        rolling seasons (plus the configured menu backgrounds), AoM ships the

        daily and pantheon events of the captured catalogue with their

        ladders, A1/A3 answer no events and A2 follows its capture.

        '
      prefixItems:
      - type: string
        description: name.
      - type: integer
        description: 'start: unix seconds.'
      - type: integer
        description: 'end: unix seconds.'
      - type: integer
        description: expiry / eventID position depends on the title block (A4 sentinel
          2066425200; stored AOM expiry end+7d for daily events).
      - type: integer
        description: 'eventID (A4: 1000+(season-1)*count+index; AoM catalogue id).'
      - type: integer
        description: eventState (local always 2; officially the running state 1).
      - type: 'null'
        description: extra slot (officially event type varies; the capture of aom
          never carries a type slot).
      - type: string
        description: 'customdata: JSON string (A4 season metadata; AoM daily challenge
          config; empty for pantheon).'
    NewsRow:
      type: array
      description: 'One news entry of the game-tree getNews, from

        `resources/config/<game>/news.toml` (the deployment ships none, so

        the catalogues are data the operator adds).

        '
      prefixItems:
      - type:
        - integer
        - string
        description: 'id: numeric when the TOML key parses as a number.'
      - type: string
        description: category.
      - type: string
        description: title.
      - type:
        - string
        - 'null'
        description: subtitle.
      - type: string
        description: text (the A3 official row layout differs; check the title).
      - type: string
        description: image URL.
      - type: string
        description: body.
      - type: string
        description: metadata.
      - type:
        - string
        - integer
        description: 'dateVisible: unix seconds (decimal string tolerated).'
      - type:
        - string
        - integer
        description: 'dateExpiry: unix seconds (decimal string tolerated).'
    ItemInstanceRow:
      type: array
      description: 'One item instance. The default profile owns every non-ItemPack

        definition the shipped catalogue declares (the official inventories

        only contain owned or earned items), and the permission mask

        defaults to 63 (the official service sends per-title constants).

        '
      prefixItems:
      - type: integer
        description: 'itemID: instance id (assigned locally).'
      - type: integer
        description: 'entityVersion: 0, +1 on every change.'
      - type: integer
        description: itemDefinitionID.
      - type: integer
        description: 'profileID: owner.'
      - type: integer
        description: 'durability: 1 default; -1 leaves it unchanged in detach.'
      - type: integer
        description: 'durabilityType: 0.'
      - type: string
        description: 'metadata: JSON string {"att":{"<key>":{"val":..}}, values written
          by updateItemAttributes carry source/mtype 0/1}.'
      - type: integer
        description: 'creationDate: unix seconds.'
      - type: integer
        description: 'locationID: 0 root inventory; AoE4 specials 3 portrait / 4 coat
          of arms / 5 monument; or a container itemID (moveItem).'
      - type: integer
        description: 'tradeID: -1 (none).'
      - type: integer
        description: 'permissionFlags mask: local default 63.'
      - type: integer
        description: 'maxChargesPerItem: -1 (none).'
    ItemLocationRow:
      type: array
      description: One item location, from the per-title itemLocations.json.
      prefixItems:
      - type: integer
        description: location id.
      - type: integer
        description: 'entityVersion: 0.'
      - type: integer
        description: locationID.
      - type: integer
        description: categoryID.
      - type: integer
        description: maxItems.
      - type: integer
        description: 'locked: 0/1.'
      - type: integer
        description: 'isPublic: 0/1.'
      - type: integer
        description: 'isForMatch: 0/1.'
      - type: integer
        description: 'tracksMoves: 0/1.'
    LoadoutRow:
      type: array
      description: One item loadout.
      prefixItems:
      - type: integer
        description: loadoutID (assigned locally).
      - type: integer
        description: profileID.
      - type: string
        description: 'name (client: "GameplayItemsdefault_layout").'
      - type: integer
        description: 'type: 1001 (gameplay items).'
      - type: string
        description: 'attributes: "[]" (the real attribute JSON is not produced yet).'
    ChatChannelRow:
      type: array
      description: One chat channel.
      prefixItems:
      - type: integer
        description: channelID (1 General, 2 Help — AoE III catalog only).
      - type: string
        description: name.
      - type: string
        description: description.
      - type: integer
        description: live member count.
    FileDescriptorRow:
      type: array
      description: 'One builtin asset descriptor of cloud/getFileURL. Slot 5 (the
        blob

        key repeated) is appended for A2 (and appears in the official AoM

        answers, although this server does not register the route for AoM).

        '
      prefixItems:
      - type: string
        description: 'name: the echoed asset name.'
      - type: integer
        description: length in bytes.
      - type: integer
        description: 'id: static catalogue id (e.g. 741324928).'
      - type: string
        description: 'url: `https://<host>/cloudfiles/<key>` (the official answers
          point at Azure blob/CDN hosts).'
      - type: string
        description: 'finalPart: the key — slot only for A2.'
    AutomatchMapRow:
      type: array
      description: 'One map of the automatch pool, served statically from

        `resources/responses/<game>/automatchMaps.json`. The official pool

        rotates between sessions; this server serves the captured snapshot.

        '
      prefixItems:
      - type: integer
        description: mapID.
      - type: string
        description: name.
      - type: integer
        description: teams.
      - type: integer
        description: max players.
      - type: integer
        description: pool / queue id.
      - type:
        - string
        - 'null'
        description: localizedName.
      - type: 'null'
        description: extra.
      - type: string
        description: extra.
    PartyRow:
      type: array
      description: One [rowCode, itemInstanceRow] roster element of a chat roster.
      prefixItems:
      - type: integer
        description: 'row code: always 0.'
      - type: array
        description: member GameProfileRow.
        items: {}
    CommunityResult:
      type: object
      description: Envelope of every /community response. A bad `title` query parameter
        is answered with the code-2 envelope over HTTP 200.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: 0 success, 2 invalid request (including a title this listener
            cannot serve).
        message:
          type: string
          examples:
          - SUCCESS
    CommunityProfile:
      type: object
      description: The /community object form of a profile. `xp` and `level` are live
        stored values here; `country` and `clanlist_name` have no source in this server
        and are always empty (documented deviation).
      required:
      - profile_id
      - name
      - alias
      - personal_statgroup_id
      - xp
      - level
      - leaderboardregion_id
      - country
      - clanlist_name
      properties:
        profile_id:
          type: integer
        name:
          type: string
          description: Platform identity, `/steam/<id>` or `/xboxlive/<id>`.
        alias:
          type: string
        personal_statgroup_id:
          type: integer
        xp:
          type: integer
        level:
          type: integer
        leaderboardregion_id:
          type: integer
        country:
          type: string
          description: No source in this server; always empty (documented deviation).
        clanlist_name:
          type: string
          description: No clan model; always empty (documented deviation).
    CommunityStatGroup:
      type: object
      required:
      - id
      - name
      - type
      - members
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: integer
          description: Always 1 (player); this server has no clan stat groups.
        members:
          type: array
          items:
            $ref: '#/components/schemas/CommunityProfile'
    CommunityLeaderboardStat:
      type: object
      description: '18 fields, the shape the live service returns (the wiki documents
        14).

        `regionrank`, `regionranktotal`, `highestrank` and `highestranklevel`

        have no source here and are served as -1 / 0.

        '
      required:
      - statgroup_id
      - leaderboard_id
      - wins
      - losses
      - streak
      - disputes
      - drops
      - rank
      - ranktotal
      - ranklevel
      - rating
      - regionrank
      - regionranktotal
      - lastmatchdate
      - highestrank
      - highestranklevel
      - highestrating
      - metadata
      properties:
        statgroup_id:
          type: integer
        leaderboard_id:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        streak:
          type: integer
          description: Positive for a winning streak, negative for a losing one.
        disputes:
          type: integer
          description: Always 0.
        drops:
          type: integer
          description: Always 0.
        rank:
          type: integer
          description: -1 when the profile holds no rank.
        ranktotal:
          type: integer
          description: -1 unknown ladder, 0 empty ladder, positive the real local
            population.
        ranklevel:
          type: integer
          enum:
          - -1
          - 0
          - 1
        rating:
          type: integer
        regionrank:
          type: integer
          description: Always -1 (no per-region ladder).
        regionranktotal:
          type: integer
          description: Always -1.
        lastmatchdate:
          type: integer
        highestrank:
          type: integer
          description: Always 0 (peaks are not persisted).
        highestranklevel:
          type: integer
          description: Always 0.
        highestrating:
          type: integer
        metadata:
          type: string
    CommunityLeaderboardMap:
      type: object
      required:
      - matchtype_id
      - statgroup_type
      - civilization_id
      properties:
        matchtype_id:
          type: integer
        statgroup_type:
          type: integer
        civilization_id:
          type: integer
          description: The official name of this field's family is race_id; the live
            service already answers civilization_id.
    CommunityLeaderboard:
      type: object
      required:
      - id
      - name
      - isranked
      - leaderboardmap
      properties:
        id:
          type: integer
        name:
          type: string
        isranked:
          type: integer
        leaderboardmap:
          type: array
          items:
            $ref: '#/components/schemas/CommunityLeaderboardMap'
    CommunityMatchType:
      type: object
      required:
      - id
      - name
      - locstringid
      properties:
        id:
          type: integer
        name:
          type: string
        locstringid:
          type: integer
          description: Always -1 (no localisation table); the catalogue names travel
            in localizedName.
        localizedName:
          type: string
    CommunityRace:
      type: object
      required:
      - id
      - name
      - faction_id
      - locstringid
      properties:
        id:
          type: integer
        name:
          type: string
        faction_id:
          type: integer
        locstringid:
          type: integer
        localizedName:
          type: string
    CommunityFaction:
      type: object
      required:
      - id
      - name
      - locstringid
      - faction_id
      properties:
        id:
          type: integer
        name:
          type: string
        locstringid:
          type: integer
        faction_id:
          type: integer
    CommunityRegion:
      type: object
      required:
      - id
      - name
      - locstringid
      properties:
        id:
          type: integer
        name:
          type: string
        locstringid:
          type: integer
        localizedName:
          type: string
    CommunityNewsItem:
      type: object
      description: '11 named fields. `newstitle_locstringid`, `newssubtitle_locstringid`

        and `newstext_locstringid` are always -1 (the official service

        delegates text to its localisation table); the raw text travels in the

        title/text/image/body fields. AoM maps the catalogue image slot to

        newsimage and other titles to the headline slot.

        '
      required:
      - id
      - hidden
      - newscategory
      - newstitle_locstringid
      - newssubtitle_locstringid
      - newstext_locstringid
      - newsimage
      - newsbody
      - metadata
      - datevisible
      - expirytime
      properties:
        id:
          description: Numeric or string, as declared in news.toml.
        hidden:
          type: integer
        newscategory:
          type: string
        newstitle_locstringid:
          type: integer
        newssubtitle_locstringid:
          type: integer
        newstext_locstringid:
          type: integer
        newsimage:
          type: string
        newsbody:
          type: string
        metadata:
          type: string
        datevisible:
          type: integer
        expirytime:
          type: integer
    CommunityAchievementDefinition:
      type: object
      required:
      - id
      - name
      - name_locstringid
      - description_locstringid
      - icon
      - timemodified
      - deleted
      - itembundle_id
      properties:
        id:
          description: Numeric or string catalogue id.
        name:
          type: string
        name_locstringid:
          type: integer
          description: Always -1; the display text travels in the catalogue slot.
        description_locstringid:
          type: integer
          description: Always -1.
        icon:
          type: string
        timemodified:
          type: integer
        deleted:
          type: integer
          description: Rows with deleted != 0 are not served.
        itembundle_id:
          type: integer
          description: -1 when the catalogue row carries no bundle.
    CommunityEarnedAchievement:
      type: object
      properties:
        achievement_id:
          type: integer
        achieveddate:
          type: integer
    CommunityAvatarStat:
      type: object
      required:
      - profile_id
      - avatarstat_id
      - value
      - lastupdated
      properties:
        profile_id:
          type: integer
        avatarstat_id:
          type: integer
        value:
          type: integer
        lastupdated:
          type: integer
    CommunityMatchURL:
      type: object
      required:
      - profile_id
      - url
      - size
      - datatype
      properties:
        profile_id:
          type: integer
        url:
          type: string
        size:
          type: integer
        datatype:
          type: integer
          description: 0 or 1 (replay kind).
    CommunityReportResult:
      type: object
      required:
      - matchhistory_id
      - profile_id
      - resulttype
      - teamid
      - civilization_id
      - xpgained
      - counters
      - customupdates
      - matchstartdate
      properties:
        matchhistory_id:
          type: integer
        profile_id:
          type: integer
        resulttype:
          type: integer
        teamid:
          type: integer
        civilization_id:
          type: integer
        xpgained:
          type: integer
        counters:
          type: string
          description: JSON object string, "{}" when empty.
