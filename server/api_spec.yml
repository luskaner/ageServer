  /wss/:
    get:
      tags:
      - Game
      summary: Notification socket (WebSocket)
      description: 'Upgrades the connection. The first frame a client must send binds
        the

        session: `{"operation": 0, "sessionToken": "<connectionToken>"}`

        (the platformlogin token) within 60 seconds — a missing/invalid

        bind closes the socket with code 1000 and a reason. The client''s

        `{"operation": 1, "ackCount": N}` keepalives are accepted as

        activity; an `operation:0` with a newer token rebinds the socket to

        the new session. While open, the socket refreshes the session every

        30 seconds; one socket per session (the newest wins). From then on

        the server pushes text frames

        `[0, <action>, <recipientProfileId>, <payload>]`: friend events,

        presence, chat, invitations, platform session updates, match

        start, match results, avatar stats and matchmaking joins — the

        frames produced by the REST calls of other clients (per-action

        payload slots in `asyncapi_spec.yml`). A client without a live

        socket receives the same frames queued through readSession.


        Differences from the official service: the envelope, binding and

        frame families match the captures; the official service also emits

        challenge, achievement, item, offline-message, friend-request and

        session-status actions this server never produces, and the

        `ChannelChatMessage` modern tail carries the message and "" in the

        reverse slot order.

        '
      operationId: gameWebSocket
      x-fidelity: Partial
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      security: []
      responses:
        '101':
          description: Switching to the WebSocket protocol; notification frames follow.
  /cloudfiles/{path}:
    get:
      tags:
      - Game
      summary: Downloads an asset or replay
      description: 'Azure Blob emulation over the builtin asset and replay stores.
        The

        URL carries the key as the path and the credential as the `sig`

        query parameter (from getTempCredentials or a replay descriptor

        upload credential). The response headers mirror the Azure Blob

        service (the download path) — Range requests supported; the

        `x-ms-meta-filename` pair is skipped for AoE3 and AoM.


        A replay persisted before a restart loses its ETag checksum

        metadata (empty ETag, missing Content-MD5) while the official blob

        always sends both. Azure''s XML error bodies and its 409

        public-access response are simplified to plain text here.

        '
      operationId: gameCloudFileDownload
      x-fidelity: Partial
      x-games:
      - A2
      - A3
      - A4
      - AoM
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: the blob key below /cloudfiles (game/<sha> builtin, replays/<matchID>/<kind>/<sha>.gz
          replay).
      - name: sig
        in: query
        required: true
        schema:
          type: string
        description: the base64 credential of the key.
      - name: title
        in: query
        required: false
        schema:
          type: string
        description: carried by the local SAS query, ignored by the store.
      responses:
        '200':
          description: The raw file with the Azure-shaped headers (the se/sv/sr/sp
            query parameters of the SAS URL are ignored beyond the credential).
          headers:
            Content-Length:
              description: size in bytes
              required: true
              schema:
                type: string
            Content-Type:
              description: the file media type (text/plain for the index pages, application/octet-stream
                for replays)
              required: true
              schema:
                type: string
            Content-MD5:
              description: base64 MD5 of the entry, only when present
              required: false
              schema:
                type: string
            Last-Modified:
              description: RFC1123 of the stored creation
              required: true
              schema:
                type: string
            Accept-Ranges:
              description: bytes
              required: true
              schema:
                type: string
            ETag:
              description: '"0x" + 16 hex digits'
              required: true
              schema:
                type: string
            Server:
              description: Windows-Azure-Blob/1.0 Microsoft-HTTPAPI/2.0
              required: true
              schema:
                type: string
            x-ms-request-id:
              description: '"8-4-4-4-12hex" with a 12-zero group'
              required: true
              schema:
                type: string
            x-ms-version:
              description: '2019-02-02'
              required: true
              schema:
                type: string
            x-ms-meta-filename:
              description: the storage basename — not sent for AoE3/AoM
              required: false
              schema:
                type: string
            x-ms-meta-ContentLength:
              description: the size string — not sent for AoE3/AoM
              required: false
              schema:
                type: string
            x-ms-creation-time:
              description: storage timestamp
              required: true
              schema:
                type: string
            x-ms-lease-status:
              description: unlocked
              required: true
              schema:
                type: string
            x-ms-lease-state:
              description: available
              required: true
              schema:
                type: string
            x-ms-blob-type:
              description: BlockBlob
              required: true
              schema:
                type: string
            x-ms-server-encrypted:
              description: 'true'
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: '"Unauthorized" — plain text, unknown or missing sig.'
        '403':
          description: '"Incorrect signature" — plain text, the sig belongs to another
            key.'
        '404':
          description: '"Not Found" — plain text, store disabled or unknown key/file.'
    put:
      tags:
      - Game
      summary: Uploads a replay
      description: 'The same credential scheme (the upload credentials are minted
        by the

        reportMatch/createOrReportSinglePlayer descriptors, scope sp=cw and

        key-pinned for five minutes). The key must be a clean

        `replays/...` path; the body streams to a `.part` file renamed into

        place when complete. The store binds the size with the `[Replays]`

        MaxFileSize limit (default 32 MiB) and raises the read deadline

        accordingly. The global 1 MiB body cap does not apply to this

        prefix. No official capture of an upload exists.

        '
      operationId: gameCloudFileUploadPut
      x-fidelity: Own
      x-games:
      - A2
      - A4
      - AoM
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: replay key below /cloudfiles (replays/...).
      - name: sig
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Stored (empty body).
          headers:
            ETag:
              description: '"0x" + 16 hex digits of the MD5'
              required: true
              schema:
                type: string
            x-ms-request-id:
              description: azure-shaped request id
              required: true
              schema:
                type: string
            x-ms-version:
              description: '2019-02-02'
              required: true
              schema:
                type: string
        '401':
          description: Missing or unknown signature.
        '403':
          description: '"Incorrect signature"/"Forbidden" — wrong key or a non-replays
            path.'
        '404':
          description: Store disabled.
        '413':
          description: '"Content Too Large" — above [Replays] MaxFileSize.'
        '500':
          description: Storage failure.
    post:
      tags:
      - Game
      summary: Uploads a replay (POST form)
      description: The POST upload form of the same handler (identical body and answer).
      operationId: gameCloudFileUploadPost
      x-fidelity: Own
      x-games:
      - A2
      - A4
      - AoM
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: sig
        in: query
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Stored; see the PUT form for the headers and failures.
        '401':
          description: Missing or unknown signature.
        '403':
          description: '"Incorrect signature"/"Forbidden".'
        '413':
          description: '"Content Too Large".'
