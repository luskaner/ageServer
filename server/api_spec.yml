            Variables:
              type: array
              items: {}
paths:
  /game/login/platformlogin:
    post:
      tags:
      - Game
      summary: Logs in to the local server and creates the session
      description: 'Creates the local session from `accountType`, `platformUserID`,

        `alias`, `title`, `macAddress` and `clientLibVersion`, sets the

        `reliclink` cookie, publishes the join presence, notifies the other

        connected clients (A3/A4/AoM through `FriendAcceptMessage`) and

        returns the configured battle servers. The session token travels as

        `connectionToken` in the answer and is the `sessionID` every other

        route sends.


        It is an anonymous route (it is the one that mints the session). When

        `Authentication` is `cached` or `online` the request is first

        validated against the official service (or its 30-day cache, or a

        previously validated ticket when offline); a failed validation is

        answered with the 2-coded array, whose `serverTime` slot — unlike the

        success path — carries an RFC3339 string.


        AoE1 sends every parameter in the query string and repeats them in

        the body (the binder reads the body); it also receives one extra

        top-level slot (`extra`, always `[]`) after `banMessage`, and no

        `stats` row inside `selectProfile` (null instead of `[]`).


        Officially sent and never read: `appID`, `auth` (the platform

        ticket), `callNum`, `connect_id`, `country`, `installationType`,

        `language`, `majorVersion`, `minorVersion`, `startGameToken`,

        `syncHash`, `timeoutOverride`, `activeMatchId`,

        `platformEnvironment`, `storeLicenseToken`, `storetoken` and

        `lastCallTime` (the A1/A3 clients).


        Differences from the official service: `selectProfile.leaderboardStats`

        is filled for A2 and A3 (Baltic Powers) only, officially every

        modern title gets a row; the client settings and the relay servers are

        local configuration instead of the official azure fleets (the fallback

        is `127.0.0.1:27012/27112` + `27212` `localhost`); `accountInfo`

        carries the constant country/currency; the

        `Request-Context` header is the fixed AoE1-3 application id where

        official deployments vary, and the official `Request-Path` header is

        not sent. The slot layouts of every title match the captures.

        '
      operationId: gamePlatformLogin
      x-fidelity: Partial
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on a binding failure or an `Authentication` rejection.
          On error the rest of the array keeps the same length but reads `""`/0/null
          per slot, and `serverTime` is an RFC3339 string.
        value: 0
      - name: connectionToken
        description: 30-char `[a-z0-9]` session id (`sessionID` of every other route);
          "" on error.
      - name: connectionID
        description: constant 0 (parsed and never used by the client; the official
          service sends a large int).
        value: 0
      - name: serverTime
        description: unix seconds (success) or RFC3339 string (error path).
      - name: accountInfo
        row: AccountInfoRow
        description: account block, null on error.
      - name: profiles
        row: GameProfileRow
        description: one row describing the logged-in user.
      - name: banLevel
        description: always 0 (no bans are modelled).
        value: 0
      - name: banSeconds
        description: always 0.
        value: 0
      - name: banMessage
        description: always null.
      - name: extra
        description: 'A1 only (slot 9): `[]`; the other titles do not have this slot.'
        value: []
      - name: clientSettings
        row: ClientSettingsRow
        description: the [key, value] list from `resources/config/<game>/login.json`.
      - name: selectProfile
        row: SelectProfileArray
        description: the per-profile block (its 9-11 slots depend on title and client
          library, see the row).
      - name: sslCertificates
        description: always [] (the official captures also carry []).
        value: []
      - name: shouldUseClientSync
        description: 0, server-authoritative sync.
        value: 0
      - name: relayServers
        row: RelayServerRow
        description: configured battle servers, or the single local fallback when
          none exist.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - platformUserID
              - alias
              properties:
                accountType:
                  type: string
                  enum:
                  - STEAM
                  - XBOXLIVE
                  description: XBOXLIVE selects the Xbox identity (account type 9,
                    `/xboxlive/...` path).
                platformUserID:
                  type: integer
                  format: int64
                  description: Steam id64 / Xbox id; regenerated from mac/ip/alias
                    when `GeneratePlatformUserId` is on.
                alias:
                  type: string
                  description: display name.
                title:
                  type: string
                  description: e.g. age2/athens; not used for routing (the listener
                    decides the game).
                macAddress:
                  type: string
                  description: seeds the generated platform user id.
                clientLibVersion:
                  type: integer
                  description: drives the row shapes (190 sanitized alias, 193 trailing
                    -1, 194 "The Baltic Powers" formats).
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  accountType: STEAM
                  platformUserID: 76561198000000001
                  alias: Luskaner
                  title: age2
                  macAddress: 00:11:22:33:44:55
                  clientLibVersion: 193
      responses:
        '200':
          description: Positional login answer (or the 2-coded error array); sets
            the cookies `reliclink` (`Expires`/`Max-Age` 1h) and the headers `Request-Context`,
            `Cache-Control`, `Expires`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 0
                  - 1
                  - 0
                  - 1764643200
                  - - 19375011
                    - /steam/76561198000000001
                    - 1
                    - -1
                    - 0
                    - en
                    - eur
                    - 1
                    - null
                  - - 1
                    - 19375011
                    - /steam/76561198000000001
                    - null
                    - Luskaner
                    - Luskaner
                    - []
                    - 4321
                    - 0
                    - 9999
                    - 1
                    - null
                    - value-platformUserID
                    - 1
                    - []
                  - 0
                  - 0
                  - 1
                  - []
                  - - value-slot
                    - value-slot
                  - - 1
                    - null
                    - null
                    - null
                    - null
                    - null
                    - []
                    - null
                    - 1
                    - null
                    - 1
                  - []
                  - 0
                  - - westeurope
                    - null
                    - 192.168.1.50
                    - 27012
                    - 27012
                    - 27012
  /game/login/logout:
    post:
      tags:
      - Game
      summary: Closes the session
      description: 'Removes the session user from its lobby advertisement, cancels
        any

        matchmaking search, leaves every chat channel (the leave

        notifications to the remaining members are staggered 100 ms apart so

        the AoE III readSession poll renders each one), sets presence 0,

        deletes the session and answers `[0]`. The other clients receive

        `PresenceMessage` (presence 0) and, on A3/A4/AoM, a

        `FriendClearMessage` frame.


        Differences from the official service: none — `[0]` is the official

        answer in every capture; the `[2]` branch (the session''s user no

        longer resolves) is a local guard.

        '
      operationId: gameLogout
      x-fidelity: Faithful
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 when the session's user cannot be resolved.
        value: 0
      security:
      - GameSession: []
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/login/readSession:
    post:
      tags:
      - Game
      summary: Polls the queued notification frames
      description: 'The fall-back notification channel when the client has no live

        WebSocket: answers with every frame queued on the session (the

        same frames `/wss/` pushes, envelope

        `[0, <action>, <subjectUserId>, <payload>]`, message list in

        `asyncapi_spec.yml`), long-polling up to 19 s; `ack` is the last

        message id the client processed and is echoed when nothing was

        queued. An absent or unparsable `ack` binds as 0.


        Differences from the official service: the message counter advances

        by one per answered batch, while the official AoE3 counter advances

        by one per frame inside the batch.

        '
      operationId: gameReadSession
      x-fidelity: Partial
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: messageId
        description: 'the id of the batch: ack+1 when frames drain, else the ack echoed.'
      - name: messages
        description: list of queued frames — each `[0, action, subjectUserId, payload]`,
          up to 100 (the queue cap).
      security:
      - GameSession: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ack:
                  type: integer
                  description: last processed message id.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  ack: 1
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 1
                  - 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/account/setLanguage:
    post:
      tags:
      - Game
      summary: Sets the client language (rejecting stub)
      description: 'Always answers `[2]`: the language is never persisted, so the
        client

        is never told that a server-side language exists in its account.

        The official service answers `[0]`.


        Officially sent and never read: `language`, `title`, `callNum`,

        `connect_id`.

        '
      operationId: gameSetLanguage
      x-fidelity: Different
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: always 2 here (the official captures answer 0).
        value: 2
      security:
      - GameSession: []
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 2
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/account/setCrossplayEnabled:
    post:
      tags:
      - Game
      summary: Enables crossplay
      description: 'Reads `crossplayEnabled` (the AoE1 client names it `enable`) from
        the

        body: `"1"` answers `[0]`, anything else answers `[2]` — crossplay

        cannot be disabled locally, because the local deployment is one

        network. The official captures only exercise the enable=1 path.

        '
      operationId: gameSetCrossplayEnabled
      x-fidelity: Faithful
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 when the value is "1"; 2 otherwise (disabling is refused locally).
        value: 0
      security:
      - GameSession: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                crossplayEnabled:
                  type: string
                  description: '1 to enable; the body is read, not the query string
                    (A1 fallback name: enable).'
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  crossplayEnabled: example
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/account/setAvatarMetadata:
    post:
      tags:
      - Game
      summary: Stores the avatar metadata
      description: 'Binds `metaData` (a JSON body `{"metaData": ...}` is accepted
        too) and

        stores it per user; the value is echoed verbatim in the profile rows

        from then on. A1 sends a full URL, A3/AoM JSON of the form

        `{"v":1,...}`/`{"v":2,...}`.

        '
      operationId: gameSetAvatarMetadata
      x-fidelity: Faithful
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on a binding failure (the profile slot is then
          []).
        value: 0
      - name: profileInfo
        row: GameProfileRow
        description: the caller's profile with the stored metadata.
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - metaData
              properties:
                metaData:
                  type: string
                  description: raw metadata string stored and echoed in profile rows.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  metaData: example
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 0
                  - - 1
                    - 19375011
                    - /steam/76561198000000001
                    - null
                    - Luskaner
                    - Luskaner
                    - []
                    - 4321
                    - 0
                    - 9999
                    - 1
                    - null
                    - value-platformUserID
                    - 1
                    - []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/account/FindProfilesByPlatformID:
    post:
      tags:
      - Game
      summary: Searches profiles by platform id
      description: 'Binds `platformIDs` (JSON array) and returns the matching profile

        rows with their presence tail. The A2+ clients send a JSON *number*

        array, the A1 client a JSON *string* array — which fails the local

        uint64 binding and answers `[2,[]]` where the official service

        answers `[0,[]]` (documented A1 deviation).

        '
      operationId: gameFindProfilesByPlatformID
      x-fidelity: Partial
      x-games:
      - A1
      - A2
      - A3
      - A4
