  /static/{filePath}:
    get:
      tags:
      - PlayFab
      summary: AoM content mirror
      description: 'The local mirror behind the CdnUrl of GetTitleData: a plain file

        server of the resources/responses/athens/playfab directory with the

        /static prefix stripped, and the one PlayFab path served without a

        token.


        Files served (the whole AoM season): public-production/1/manifest.json

        (UploaderPrototypeTestSeason, its quest_pool and guineafowl gauntlet),

        public-production/2/manifest.json (Season0 with

        CurrentSeason/Seasons/GauntletPath/GauntletMissionPoolsPath/

        FeatureFlagsPath/KnownBlessingsPath/DailySkirmishPlusPath pointers),

        the season JSONs themselves, gauntlet.json, gauntlet_mission_pools

        .json, quest_pool.json, feature_flags.json, known_blessings.json and

        daily_skirmish_plus.json. The manifests are replayed from the

        capture verbatim; the blobs they point to carry this server''s

        labyrinth metadata.


        Officially these files live behind the azurefd CDN host of the

        capture — a probe of /static on the playfab host answers 404 with an

        empty body over there, so every deviation is the redirect itself,

        which is what keeps the season content inside the LAN. A missing file

        answers Go''s plain-text ''404 page not found''.

        '
      operationId: playfabStatic
      x-fidelity: Own
      x-games:
      - AoM
      security: []
      parameters:
      - name: filePath
        in: path
        required: true
        schema:
          type: string
        description: path under public-production (e.g. '2/manifest.json').
      responses:
        '200':
          description: The requested file (Content-type by extension — application/json
            for .json).
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Plain-text '404 page not found'.
          content:
            text/plain:
              schema:
                type: string
