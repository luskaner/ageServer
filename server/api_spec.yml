  /CloudScript/ExecuteFunction:
    post:
      tags:
      - PlayFab
      summary: Gauntlet functions (AoM)
      description: "The three CloudScript functions the Gauntlet runs on:\n\n* BuildGauntletLabyrinth\
        \ — plays a fresh labyrinth (bought with the\n  /static gauntlet config):\
        \ the generated node graph becomes the\n  user's labyrinth, progress resets\
        \ to 3 lives and the DataVersion\n  bumps. FunctionResult is '{Labyrinth:{…},Progress:{…}}'.\n\
        * StartGauntletMission — marks the mission as being played\n  (FunctionResult\
        \ is the object {} with FunctionResultSize 2 — the\n  official service omits\
        \ FunctionResult and sends 0).\n* AwardMissionRewards — after a won Mission_Gauntlet_*\
        \ mission the\n  mission's rewards land in the user's inventory; FunctionResult\
        \ is\n  '{itemsAdded:[{amount,itemFriendlyId}…]}' (empty list for a lost\n\
        \  mission, an unknown mission or a stock Season0 id: those come back\n  pre-completed).\n\
        \nAny other FunctionName (the capture's GetLeaderboardData, which\nofficially\
        \ only ever answered 401 for this player) is the parse\nenvelope. The Labyrinth/Mission\
        \ rows in the result match the\nofficial mission shape field for field (Id,\
        \ Predecessors,\nPositionX/Y, Visualization, Map, Size, VictoryCondition,\
        \ GameType,\nMapVisibility, StartingResources, AllowTitans, WorldTwists,\n\
        Opponents, OpponentsFor2PlayerCoop, Rewards, MinimapImage='',\nMapPreviewImage='\
        \ ')' — only the generator's choices differ, which\nis the point of a local\
        \ labyrinth.\n\nFunctionParameter must be valid JSON for the requested function;\n\
        GeneratePlayStreamEvent, Entity and CustomTags are ignored.\nExecutionTimeMilliseconds\
        \ is the local compute time (usually a\nsingle-digit number; the capture's\
        \ cloud round trip was 250 ms).\n"
      operationId: playfabExecuteFunction
      x-fidelity: Partial
      x-games:
      - AoM
      security:
      - PlayFabEntityToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - FunctionName
              - FunctionParameter
              properties:
                FunctionName:
                  type: string
                  enum:
                  - BuildGauntletLabyrinth
                  - StartGauntletMission
                  - AwardMissionRewards
                FunctionParameter: {}
                GeneratePlayStreamEvent:
                  type: boolean
                  description: ignored.
                Entity:
                  type: object
                  description: ignored.
                CustomTags:
                  type: object
                  description: ignored.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  FunctionName: GetLeaderboard
                  FunctionParameter: {}
                  GeneratePlayStreamEvent: true
                  Entity: *id004
                  CustomTags: *id003
      responses:
        '200':
          description: Envelope with the execution result.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PlayFabEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - ExecutionTimeMilliseconds
                      - FunctionName
                      - FunctionResultSize
                      properties:
                        ExecutionTimeMilliseconds:
                          type: integer
                        FunctionName:
                          type: string
                        FunctionResult:
                          description: 'Absent for a function whose result serialises
                            to

                            null. BuildGauntletLabyrinth: the labyrinth and

                            progress objects. StartGauntletMission: {}.

                            AwardMissionRewards: the itemsAdded list.

                            '
                        FunctionResultSize:
                          type: integer
        '400':
          description: Parse envelope (invalid JSON, missing FunctionName, unknown
            function or a FunctionParameter that does not unmarshal).
