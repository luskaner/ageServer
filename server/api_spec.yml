  /test/root:
    get:
      tags:
      - Ops
      summary: Announcement probe
      description: 'The launcher''s up-check for a title listener: one of this server''s

        own routes, registered before the host dispatch on every host of

        every title (the general router wraps the whole listener). The

        official service has no counterpart — the probes captured against

        official hosts answer istio''s empty 404.

        '
      operationId: opsTestRoot
      x-fidelity: Own
      security: []
      responses:
        '200':
          description: Announcement with the listener's identity.
          headers:
            X-Id:
              description: Server instance UUID (the listener's id).
              required: true
              schema:
                type: string
            X-Version:
              description: Announcement protocol version — 2.
              required: true
              schema:
                type: integer
                enum:
                - 2
          content:
            application/json:
              schema:
                type: object
                required:
                - GameTitle
                - Version
                properties:
                  GameTitle:
                    type: string
                    enum:
                    - age1
                    - age2
                    - age3
                    - age4
                    - athens
                    description: The title this listener serves.
                  Version:
                    type: string
                    description: The server build version (set at build time).
  /cacert.pem/root:
    get:
      tags:
      - Ops
      summary: Trust anchor of the listener
      description: 'The certificate a client can install to trust this server: the
        CA

        certificate (cacert.pem) for the titles whose hosts serve a CA-signed

        leaf, or the self-signed certificate this server generates for the

        A1/A2/A3 self-signed titles. Served as a file, so the body is the

        PEM encoding; 404 when the file is absent (nothing was generated),

        500 when the executable''s own path is unresolvable. Officially the

        probes answer istio''s empty 404 — this route is the server''s own.

        '
      operationId: opsCacertRoot
      x-fidelity: Own
      security: []
      responses:
        '200':
          description: PEM-encoded certificate (Content-Type sniffed from the file
            content — text/plain; charset=utf-8 in practice).
          content:
            text/plain:
              schema:
                type: string
                description: 'The PEM blocks: -----BEGIN CERTIFICATE----- … -----END
                  CERTIFICATE-----.'
        '404':
          description: The certificate does not exist.
        '500':
          description: The executable path is unresolvable.
  /sigkey.der:
    get:
      tags:
      - Ops
      summary: Response-signing public key
      description: 'The DER-encoded SubjectPublicKeyInfo (2048-bit RSA) that verifies

        every dataSignature field of the game tree — the key this server

        signs its ladders and catalogs with, since the official one is

        private. 404 when the key file is absent, 500 when the executable''s

        path is unresolvable. Officially unknown: the official signatures

        are verified against a public key shipped inside the client.

        '
      operationId: opsSigkey
      x-fidelity: Own
      security: []
      responses:
        '200':
          description: DER-encoded SPKI of the 2048-bit RSA signing key (served as
            application/octet-stream).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: The key does not exist.
        '500':
          description: The executable path is unresolvable.
  /shutdown:
    post:
      tags:
      - Ops
      summary: Local shutdown switch
      description: 'Tells the server to exit (it sends itself an interrupt, which
        ends

        with the graceful shutdown path). Registered on Windows builds

        only — on other platforms the route does not exist and a POST

        answers 404. The body is ignored.


        The guard: the caller''s remote IP must be one of the machine''s own

        addresses (the loopback or LAN IPs the server listens on) — a

        shutdown from any other machine is refused. On success the 200 comes

        back with an empty body before the process exits.

        '
      operationId: opsShutdown
      x-fidelity: Own
      security: []
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: Ignored entirely — no field is read.
      responses:
        '200':
          description: Shutdown accepted — empty body; the process exits next.
        '401':
          description: The caller is not one of the server machine's own addresses.
        '500':
          description: The caller's address is unparseable or no local address resolves.
        '404':
          description: Non-Windows build — the route is not registered.
  /test/api:
    get:
      tags:
      - Ops
      summary: Mods-API library liveness (api hosts)
      description: 'The liveness probe of the ageAPIServer library embedded under
        the

        api.ageofempires.com (and api-dr.ageofempires.com for A4) hosts: the

        path is rewritten onto the library''s own /test locally and never

        follows the upstream client condition. When [Api] Enabled is false

        the whole tree — its diagnostics included — is off: the probe

        answers 404 instead of falling through to the official service, so

        the diagnostics cannot be a second way in.

        '
      operationId: opsTestApi
      x-fidelity: Own
      security: []
      responses:
        '200':
          description: The library's system store is reachable.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
        '503':
          description: The library's system store is unhealthy.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
        '404':
          description: '[Api] Enabled is false — the whole tree is off.'
  /cacert.pem/api:
    get:
      tags:
      - Ops
      summary: Mods-API library certificate (api hosts) — never served
      description: 'Rewritten onto the library''s own /cacert.pem like /test/api,
        but

        always empty: this server terminates TLS for the library itself, so

        the library owns no certificate of its own and its route answers

        404 — the listenable certificate is /cacert.pem/root. With

        [Api] Enabled=false it stays 404 as part of the tree being off.

        '
      operationId: opsCacertApi
      x-fidelity: Own
      security: []
      responses:
        '404':
          description: Always — the library owns no certificate when embedded.
