  /Client/LoginWithCustomID:
    post:
      tags:
      - PlayFab
      summary: Login by local user id (A4)
      description: "The login form A4 uses against this server. `CustomId` is parsed\
        \ as a\n32-bit signed decimal and looked up among the local users: it is the\n\
        ageAPIServer user id, not an official PlayFab custom id.\n\nDifferences from\
        \ the official capture:\n* SessionTicket, PlayFabId and EntityToken are all\
        \ the same 16-hex\n  local id — the official ticket has 5 segments and a different\n\
        \  entity token blob.\n* NewlyCreated is always true (officially it is false\
        \ once the account\n  exists).\n* LastLoginTime is the constant '2025-11-12T03:34:00.000Z'.\n\
        * Entity.Id is a fresh UUID v4 (officially a 16-hex uppercase id).\n* An unknown\
        \ CustomId answers 200 OK with every id field empty\n  instead of an error\
        \ envelope.\n* A malformed body or a non-numeric CustomId gets the generic\
        \ parse\n  envelope, officially a styled PlayFab error.\n"
      operationId: playfabLoginWithCustomID
      x-fidelity: Partial
      x-games:
      - A4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - CustomId
              properties:
                CustomId:
                  type: string
                  description: the local user id, decimal (anything else is a parse
                    failure).
                CreateAccount:
                  type: boolean
                  description: ignored (an unknown user still produces the empty-id
                    envelope).
                InfoRequestParameters:
                  type: object
                  description: ignored (always answered with the empty payload).
                LoginTitlePlayerAccountEntity:
                  type: boolean
                  description: ignored (the Entity block is always present).
                TitleId:
                  type: string
                  description: ignored (officially "ED603").
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  CustomId: steam-76561198000000001
                  CreateAccount: true
                  InfoRequestParameters: &id002 {}
                  LoginTitlePlayerAccountEntity: true
                  TitleId: ED603
      responses:
        '200':
          description: Envelope with the login payload plus the empty combined-info
            skeleton.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PlayFabEnvelope'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/PlayFabLoginResponse'
                      - type: object
                        properties:
                          InfoResultPayload:
                            type: object
                            properties:
                              UserInventory:
                                type: array
                                items: {}
                              UserDataVersion:
                                type: integer
                              UserReadOnlyData:
                                type: object
                                additionalProperties: {}
                              UserReadOnlyDataVersion:
                                type: integer
                              CharacterInventories:
                                type: array
                                items: {}
        '400':
          description: Parse envelope (invalid JSON or non-decimal CustomId).
  /Client/GetUserData:
    post:
      tags:
      - PlayFab
      summary: RLink profile id (A4)
      description: "A4's link between the PlayFab account and the Relic profile: one\
        \ entry\nunder the key RLinkProfileID whose Value is the local user id as\
        \ a\ndecimal string.\n\nDifferences from the official capture:\n* The entry\
        \ key order is LastUpdated, Permission, Value (officially\n  Value, LastUpdated,\
        \ Permission).\n* DataVersion is always 0 — the official capture reports 1.\n\
        * The envelope data field order is DataVersion then Data (officially\n  Data\
        \ then DataVersion).\n* The top-level data keys are always built, never filtered\
        \ by Keys —\n  a request for any other key still answers the same single entry.\n\
        * Permission is 'public' (officially 'Public').\n"
      operationId: playfabGetUserData
      x-fidelity: Partial
      x-games:
      - A4
      security:
      - PlayFabSessionTicket: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Keys:
                  type: array
                  items:
                    type: string
                  description: ignored — the only key ever answered is RLinkProfileID.
                PlayFabId:
                  type: string
                  description: ignored.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  Keys: &id001
                  - PlayerProfile
                  PlayFabId: '19375011'
        description: Ignored entirely — no field is read.
      responses:
        '200':
          description: Envelope with the RLinkProfileID entry.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PlayFabEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - DataVersion
                      - Data
                      properties:
                        DataVersion:
                          type: integer
                          description: always 0.
                        Data:
                          type: object
                          required:
                          - RLinkProfileID
                          properties:
                            RLinkProfileID:
                              type: object
                              required:
                              - LastUpdated
                              - Permission
                              - Value
                              properties:
                                LastUpdated:
                                  type: string
                                  description: now, 'yyyy-MM-ddTHH:mm:ss.fffZ'.
                                Permission:
                                  type: string
                                  description: always 'public'.
                                Value:
                                  type: string
                                  description: the bound local user id, decimal.
  /Client/GetTitleData:
    post:
      tags:
      - PlayFab
      summary: CDN configuration (AoM)
      description: "Points the game at its content bundles. Local data redirects AoM's\n\
        blob CDN to this server's own /static mirror and pairs it with a\ntwo-bundle\
        \ config derived from the mirror layout, so nothing leaves\nthe LAN. Everything\
        \ else in the shape matches the capture.\n\nDifferences from the official\
        \ capture:\n* CdnUrl is 'https://<playfab host>/static' (officially\n  'https://athens-static-prod-hbawaea4abb2hxbk.b01.azurefd.net/static-prod').\n\
        * CdnPathConfig carries only the 'public/production' rule and two\n  bundles\
        \ with short ids '2' and '1' (RequiresGameVersion 2 and 1,\n  sorted descending);\
        \ the official one also carries a\n  'public/release-candidate' rule (GameVersionGreaterThan\
        \ 5) and 17\n  40-hex bundle ids.\n"
      operationId: playfabGetTitleData
      x-fidelity: Partial
      x-games:
      - AoM
      security:
      - PlayFabEntityToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Keys:
                  type: array
                  items:
                    type: string
                  description: ignored — both keys are always answered.
                OverrideLabel:
                  type: string
                  description: ignored.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  Keys: *id001
                  OverrideLabel: ''
        description: Ignored entirely — no field is read.
      responses:
        '200':
          description: Envelope with the redirect configuration.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PlayFabEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - Data
                      properties:
                        Data:
                          type: object
                          required:
                          - CdnUrl
                          - CdnPathConfig
                          properties:
                            CdnUrl:
                              type: string
                              description: the local mirror URL of the form https://<this
                                host>/static.
                            CdnPathConfig:
                              type: string
                              description: 'A JSON-encoded config string:

                                {"Rules":[{"Target":{"CdnBranch":"public/production"}}],

                                "CdnBundles":[{"Id":"2","CdnBranch":"public/production","RequiresGameVersion":2},

                                {"Id":"1","CdnBranch":"public/production","RequiresGameVersion":1}]}.

                                '
  /Client/GetUserReadOnlyData:
    post:
      tags:
      - PlayFab
      summary: Challenge state (AoM)
      description: "The Gauntlet / story-mission state of the bound user, read-only.\n\
        The recognised keys are:\n\n* PunchCardProgress — '{\"Holes\":0,\"DateOfMostRecentHolePunch\"\
        :\"2024-05-02T03:34:00.000Z\"}'.\n* CurrentGauntletProgress — '\"{\"Lives\"\
        :3,\"CompletedMissions\":[],\"Inventory\":[],\"MissionBeingPlayedRightNow\"\
        :\"\"}'\n  once BuildGauntletLabyrinth has run; before that the key is absent.\n\
        * CurrentGauntletLabyrinth — the labyrinth JSON once\n  BuildGauntletLabyrinth\
        \ has run; before that the key is absent.\n* Mission_Season0_<id> — a whole\
        \ social season served as\n  all-completed: '{\"State\":\"Completed\",\"RewardsAwarded\"\
        :\"Hard\",\"CompletionCountEasy\":0,\"CompletionCountMedium\":0,\"CompletionCountHard\"\
        :1}'.\n  An unknown Mission_Season0_* spelling answers the zero envelope\n\
        \  with Value null.\n\nEvery unrecognised key is simply not echoed. All KVPs\
        \ of a fresh user\ncome with Permission 'Private' and the data is local by\
        \ design — the\nofficial service carries the real Gauntlet progress, which\
        \ this\nserver deliberately grants unlocked.\n\nDifferences from the official\
        \ capture: the entry key order is\nLastUpdated, Permission, Value (officially\
        \ Value, LastUpdated,\nPermission); DataVersion counts the local challenge\
        \ writes\n(BuildGauntletLabyrinth / StartGauntletMission / AwardMissionRewards)\n\
        instead of the official one; and the official capture can serve keys\nthis\
        \ server has no equivalent for (e.g. per-event metadata), which\nshow up here\
        \ as absent.\n"
      operationId: playfabGetUserReadOnlyData
      x-fidelity: Faithful
      x-games:
      - AoM
      security:
      - PlayFabEntityToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - Keys
              properties:
                IfChangedFromDataVersion:
                  type: integer
                  description: 'Client cache token: when present and not lower than
                    the

                    stored DataVersion the answer keeps Data empty ({}) — the

                    client already has the values.

                    '
                Keys:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Required and non-empty, otherwise the parse envelope.
                    Known keys as listed in the description.
                PlayFabId:
                  type: string
                  description: ignored — the session's user is always used.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  IfChangedFromDataVersion: 1
                  Keys: *id001
                  PlayFabId: '19375011'
      responses:
        '200':
          description: Envelope with the requested keys that have data.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PlayFabEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - DataVersion
                      - Data
                      properties:
                        DataVersion:
                          type: integer
                        Data:
                          type: object
                          description: always an object — {} when the cache token
                            matched or no key had data.
                          additionalProperties:
                            type: object
                            required:
                            - LastUpdated
                            - Permission
                            - Value
                            properties:
                              LastUpdated:
                                type: string
                                description: the update stamp, yyyy-MM-ddTHH:mm:ss.fffZ,
                                  of the value.
                              Permission:
                                type: string
                                description: always 'Private'.
                              Value:
                                type: string
                                description: the JSON-encoded payload string.
        '400':
          description: Parse envelope (invalid JSON or empty Keys).
  /Client/LoginWithSteam:
    post:
      tags:
      - PlayFab
      summary: Login by Steam ticket (AoM)
      description: 'Extracts the Steam id from the ticket, binds it to the local user
        and

        creates the PlayFab session. The parser accepts both ticket shapes the

        game sends: the entitlement/ownership ticket with the GC wrapper, and

        the plaintext varint-encoded protobuf encrypted-app-ticket (a

        plaintext ticket cannot come from a valve backend, so that session is

        flagged not-official). The parsed ticket bytes are never validated

        against Steam — there is no Steam backend to ask.


        Differences from the official capture: SessionTicket, PlayFabId and

        EntityToken are all the same 16-hex local id (officially a real

        5-segment ticket); an unparseable ticket answers the generic parse

        envelope instead of PlayFab''s InvalidSteamTicket (errorCode 1010);

        an unknown Steam user answers 200 OK with empty id fields; and the

        remaining login quirks of LoginWithCustomID (NewlyCreated true,

        constant LastLoginTime) apply.

        '
      operationId: playfabLoginWithSteam
      x-fidelity: Partial
      x-games:
      - AoM
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - SteamTicket
              properties:
                SteamTicket:
                  type: string
                  description: hex-encoded Steam ticket (ownership ticket, GC wrapper
                    or plaintext protobuf ticket).
                CreateAccount:
                  type: boolean
                  description: ignored.
                CustomTags:
                  type: object
                  description: ignored.
                InfoRequestParameters:
                  type: object
                  description: ignored — the login payload has no InfoResultPayload
                    (matches the capture).
                PlayerSecret:
                  type: string
                  description: ignored.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  SteamTicket: hex-encoded-steam-auth-ticket
                  CreateAccount: true
                  CustomTags: &id003 {}
                  InfoRequestParameters: *id002
                  PlayerSecret: example
      responses:
        '200':
          description: Envelope with the login payload (no InfoResultPayload).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PlayFabEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PlayFabLoginResponse'
        '400':
          description: Parse envelope (invalid JSON or unparseable SteamTicket).
