  /game/advertisement/host:
    post:
      tags:
      - Game
      summary: Creates and hosts a lobby advertisement
      description: 'Creates the lobby (`advertisementid` must be -1 for a fresh lobby),

        assigns its id, adds the host as the first peer and answers with the

        battle server of the relay region (configured, or the request''s

        interface address), the region, the current peers and the metadata.

        When `automatchPoll_id > 0` the lobby is the matchmaking host of a

        pending reservation and the other players are notified

        (`Automatch2GameMessage`); AoE1 additionally attaches the queued

        peers server-side. `joinable` is forced true for A1 and AoE3 below

        the Baltic Powers, AoE1 lobbies always use one port pair less (no

        out-of-band slot) and no battle-server name in their advertisement

        rows. The AoE1/AoE3 clients send every field in the query string and

        repeat it in the body; only the body is bound.


        Differences from the official service: the battle server address is

        the local LAN address where official deployments answer "" for LAN

        lobbies; the metadata block of an A2/A4 host answer is the generated

        Xbox session JSON while the captured Steam host answers carry `"0"`

        (the scid JSON of other titles matches the official bytes);

        officially sent and never read: `callNum`, `connect_id`,

        `lastCallTime`.

        '
      operationId: gameAdvertisementHost
      x-fidelity: Faithful
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: errorCode
        description: '0 on success; 2 on a binding failure, a bad checksum description
          ("AUTOMATCH"?), an unknown relay region, an id that is not -1 without a
          reservation, an unknown host or a store failure. On error: advertisementId
          0, peers [], the local battle-server defaults.'
        value: 0
      - name: advertisementId
        description: the assigned, random lobby id; 0 on error.
      - name: authtoken
        description: literal string "authtoken" (official value).
        value: authtoken
      - name: battleServer
        row: BattleServerAddress
        description: 'the battle server block: [IPv4, bsPort, wsPort, oobPort?] —
          the oob slot only for A2/A3/A4/AoM; ports 0 until a battle server is configured.'
      - name: relayRegion
        description: the region echoed (a normal region, or the LAN GUID for LAN lobbies).
      - name: peers
        row: PeerRow
        description: the peers after the host was added (just the host).
      - name: zero
        description: constant 0 slot of the official response (A1 stops here after
          the peers).
        value: 0
      - name: tail
        description: 'A1 (slots 10): metadata — `0` for a LAN lobby or the Xbox session
          JSON for a WAN host; A2/A4/AoM and AoE3 >= 194 (slots 10-14): 0, null, null,
          metadata, description; AoE3 below 194 (slot 10): metadata string "0".'
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - advertisementid
              - description
              properties:
                advertisementid:
                  type: integer
                  description: -1 to create.
                appbinarychecksum:
                  type: integer
                  description: version checksum
                  matched at join.: null
                datachecksum:
                  type: integer
                moddllfile:
                  type: string
                  description: '"INVALID" without mods.'
                moddllchecksum:
                  type: integer
                modname:
                  type: string
                modversion:
                  type: string
                versionFlags:
                  type: integer
                description:
                  type: string
                  description: lobby title; "AUTOMATCH"/"SESSION_MATCH_KEY" mark matchmaking
                    and session lobbies.
                automatchPoll_id:
                  type: integer
                  description: '>0: this is the host lobby of a matchmaking reservation.'
                relayRegion:
                  type: string
                  description: region name or the LAN battle-server GUID (read from
                    the body).
                mapname:
                  type: string
                hostid:
                  type: integer
                  description: 0 = the session user.
                isObservable:
                  type: boolean
                observerDelay:
                  type: integer
                observerPassword:
                  type: string
                password:
                  type: string
                  description: matched verbatim at join; never echoed.
                passworded:
                  type: boolean
                visible:
                  type: boolean
                joinable:
                  type: boolean
                  description: forced true for A1 and old AoE3 libraries.
                statgroup:
                  type: integer
                  description: accepted but unused.
                matchtype:
                  type: integer
                maxplayers:
                  type: integer
                options:
                  type: string
                  description: opaque base64+zlib block
                  stored and echoed.: null
                slotinfo:
                  type: string
                  description: opaque base64+zlib block.
                psnSessionID:
                  type: integer
                  format: int64
                  description: empty string tolerated.
                state:
                  type: integer
                  description: usually -1 at creation.
                serviceType:
                  type: integer
                  description: 0 online; 1 marks a LAN lobby.
                race:
                  type: integer
                team:
                  type: integer
                party:
                  type: integer
                  description: -1 none, else the parent lobby id (it must exist and
                    be a party root).
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  advertisementid: 44000001
                  appbinarychecksum: 0
                  datachecksum: 0
                  moddllfile: INVALID
                  moddllchecksum: 0
                  modname: ''
                  modversion: ''
                  versionFlags: 1
                  description: LAN lobby
                  automatchPoll_id: 1
                  relayRegion: westeurope
                  mapname: example
                  hostid: 1
                  isObservable: true
                  observerDelay: 30
                  observerPassword: ''
                  password: lan-password
                  passworded: false
                  visible: true
                  joinable: true
                  statgroup: 1
                  matchtype: 1
                  maxplayers: 8
                  options: example
                  slotinfo: example
                  psnSessionID: 1
                  state: 0
                  serviceType: 1
                  race: 1
                  team: 1
                  party: 1
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 0
                  - 44000001
                  - authtoken
                  - - 192.168.1.50
                    - 27012
                    - 27012
                    - 27012
                  - 1
                  - - 1
                    - 19375011
                    - -1
                    - 4321
                    - 1
                    - 1
                    - /10.0.11.5
                  - 0
                  - 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/advertisement/join:
    post:
      tags:
      - Game
      summary: Joins a lobby
      description: 'Validates the optional lobby password, removes the joiner from
        its

        previous lobby first (A4 keeps several for its groups flow), adds it

        as a peer and answers with the battle server and the joiner''s own

        peer row. A mismatch of version/modChecksums, `joinable` = false,

        `party` not matching the lobby, a wrong password or an unknown

        advertisement refuses the join; a matchmaking join skips those

        checks (the lobby is server-managed).


        Differences from the official service: `resolvedIP` is the local

        battle server (officially "" for LAN lobbies); the checksum,

        version, party, race, team and password semantics match the

        official captures. Officially sent and never read: `statgroup`,

        `callNum`, `connect_id`, `lastCallTime`.

        '
      operationId: gameAdvertisementJoin
      x-fidelity: Faithful
      x-games:
      - A1
      - A2
      - A3
      - A4
      - AoM
      x-response-positions:
      - name: resultCode
        description: 0 on success; 2 on any refusal (the rest of the array stays,
          with ""/0 defaults).
        value: 0
      - name: hostIP
        description: the lobby's synthetic "/10.0.11.N" address (the same space the
          official deployments use).
      - name: resolvedIP
        description: the battle server address of the relay region; the local interface
          address for LAN/unknown regions (officially "").
      - name: battlePorts
        description: '[bsPort, wsPort, oobPort?] — the out-of-band slot only for A2/A3/A4/AoM.'
      - name: peer
        row: PeerRow
        description: one nested list containing the joiner's peer row.
      security:
      - GameSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - advertisementid
              properties:
                advertisementid:
                  type: integer
                appbinarychecksum:
                  type: integer
                  description: must match the lobby's.
                datachecksum:
                  type: integer
                moddllfile:
                  type: string
                moddllchecksum:
                  type: integer
                modname:
                  type: string
                modversion:
                  type: string
                versionFlags:
                  type: integer
                password:
                  type: string
                  description: required whenever the lobby has one and it is not a
                    matchmaking join.
                party:
                  type: integer
                  description: -1 or the lobby party; forced -1 on a matchmaking join.
                race:
                  type: integer
                team:
                  type: integer
                  description: forced -1 on a matchmaking join.
            examples:
              lanRequest:
                summary: LAN launcher request
                value:
                  advertisementid: 44000001
                  appbinarychecksum: 0
                  datachecksum: 0
                  moddllfile: INVALID
                  moddllchecksum: 0
                  modname: ''
                  modversion: ''
                  versionFlags: 1
                  password: lan-password
                  party: 1
                  race: 1
                  team: 1
      responses:
        '200':
          description: Positional JSON array; the slot order is in the operation's
            `x-response-positions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positional'
              examples:
                sample:
                  summary: Realistic LAN server answer
                  value:
                  - 0
                  - 1
                  - 1
                  - 27012
                  - - 1
                    - 19375011
                    - -1
                    - 4321
                    - 1
                    - 1
                    - /10.0.11.5
        '401':
          $ref: '#/components/responses/Unauthorized'
  /game/advertisement/update:
    post:
      tags:
      - Game
      summary: Updates a lobby
      description: 'Updates the lobby from the form. When the advertised id is this

        user''s matchmaking reservation and no lobby exists yet, the lobby is

        created here (server-supplied description, map, maxplayers and relay

        region; `joinable` true; the caller a peer) — the matchmaking host

        never calls `host`. While the lobby is a matchmaking reservation

        the server-supplied fields stay; a `state` of 1 stamps the start

        time and the state never moves back. A2/A4/AoM and AoE3 from library

        194 answer with the encoded advertisement as a second slot; A1 and

