  /game/party/reportMatch:
    post:
      tags:
      - Game
      summary: Reports the result of a match
      description: 'Persists the match and every player row, updates ratings

        (Elo for ranked ladders, the hidden MMR for queues), the

        win/loss/streak counters and the challenge progress from the

        client-update blobs, then answers 16 slots.


        `countersZip` is a JSON string wrapping

        base64(gzip(JSON array of per-player counter-object strings)),

        capped at 1 MiB decompressed and with one entry per profile: an

        unparsable value empties the counters and the match is still stored;

        an empty value keeps whatever the first reporter stored. `itemUpdates`

        is a JSON array of per-player JSON strings whose per-player keys

        (itemUpdates / challengeUpdates / eventChallengeUpdates /

        clientUpdates) default to `[]`/`{}` — a malformed player block is

        kept as raw text so one bad row cannot fail the whole bind.

        `simplayerIDs` is int64 because AoE III sends 4294967295 for "no sim

        player" (the field is only logged).


        Differences from the official service: the official AoE1 body has

        14 slots — the local answer is always 16 (the extra two `[]` slots

        trail on A1); slots 8 (`clientUpdates`) and 15 (`replayUploads`)

        carry rows in the official A4 rated report and stay empty here; the

        official failure codes include a 5 unknown-match refusals where only

        2 exists here, and reports for matches this server never paired are

        stored unrated and answered `[0, ...]` (the official answer was an

        error). The replay descriptors are the official shape for every

        title that uploads replays.

        '
