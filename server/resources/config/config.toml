# Whether to log all the info the terminal plus more info to a file. Enable it for errors.
Log = false

# Whether to generate the Platform User Id. *ONLY* as a last resort if multiple users
# are using Custom Launchers and they are sharing incorrectly the same Platform User Id.
# May show the same user as multiple in the leaderboards.
# Incompatible with Authentication not set to 'disabled'.
GeneratePlatformUserId = false

# Authentication method to use. Accepted values:
# required: authenticate the user with the official servers as it was, effectively, the same.
# cached: authenticate with the official server at least once every 30 days (tied to user platform user id).
# adaptive: resolve to 'cached' if internet is detected or 'disabled' otherwise.
# disabled: no authentication as it worked before.
Authentication = 'disabled'

# Whether the server re-signs the catalogues it serves (itemDefinitions.json, itemBundleItems.json,
# levelRewardsTable.json and the arrays ending in a signature) with its own key, instead of serving
# the signatures already captured inside those files.
# Leave it false for a stock client: the captured signatures are the ones it trusts. Turn it on only
# together with a client that trusts this server's signing key, otherwise it rejects every catalogue.
[Sign]
# When Enabled is true, the server signs responses with its own key.
# When false (default), the server uses the captured signatures from resources/responses.
Enabled = false

# PlatformUserIdExceptions is a list of platform user IDs for which signing
# is the REVERSE of Enabled. This allows selective signing:
# - When Enabled = true: users in this list get unsigned (captured) responses
# - When Enabled = false: users in this list get signed responses
# The platform user ID is the numeric ID (e.g., "76561198000000000" for Steam, Xbox ID for Xbox).
PlatformUserIdExceptions = []

[Internet]
# Whether to allow the server to use the Internet at all (DNS connectivity check,
# authentication, and public IP detection). Set to false for fully offline/air-gapped use.
Enabled = true

# Manually specify the external/public IPv4 address of this server. If set, this value is used
# instead of querying https://api.ipify.org/. Set to 'auto' (default) to auto-detect,
# which requires Internet.Enabled = true.
IP = 'auto'

[Games]
# Games that the server will accept.
# "age1" (AoE: DE), "age2" (AoE II: DE), "age3" (AoE III: DE), "age4" (AoE IV: AE) and "athens" (AoM: RT).
Enabled = []

# Games.<game>.Hosts is the hosts/IPs the server will bind to for that game. Only IPv4 is supported.
# Must be *unique* within enabled games.
# *Recommended to change to the LAN host* (use 0.0.0.0 and 127.0.0.1 for testing)

[Games.age1]
Hosts = ['0.0.0.0']

[Games.age2]
Hosts = ['0.0.0.0']

[Games.age3]
Hosts = ['0.0.0.0']

[Games.age4]
Hosts = ['0.0.0.0']

[Games.athens]
Hosts = ['0.0.0.0']

# CONFIGURING BATTLE SERVERS
# See the complete information in BattleServers.md
[Announcement]

# Whether to respond discovery queries in LAN. When disabled, the launcher will not automatically detect it.
Enabled = true
# Whether to respond discovery queries in the Multicast address.
Multicast = true
# Port to announce to. If changed, the launchers will need to specify the port in Server.AnnouncePorts
Port = 31978
# Multicast group to respond to (IPv4 only).
# If changed, the launchers will need to specify the address in Server.AnnounceMulticastGroups.
MulticastGroup = '239.31.97.8'

# CONFIGURING CUSTOM FILES
# Serves the /api/MatchContent/ endpoints used by the game to upload and
# download multiplayer savegames. Without it, restoring a saved
# multiplayer game fails with "Failed to upload/download custom files".
# They are served by the embedded ageAPIServer library, the same instance as
# the mods API, so this section configures that store.
[CustomFiles]

# Whether to enable the endpoints locally. On the Age of Empires hosts every
# request follows the official-client condition of [Mods]: an official client
# with internet is proxied upstream, everything else gets the local answer this
# section controls, and without internet nothing is proxied:
#   CustomFiles  official client + internet  emulated client / no internet
#   on           upstream proxy              local library
#   off          upstream proxy              local 404
# The library is built when either this section or [Mods] is enabled; when both
# are disabled there is no instance and the host handler answers the request
# (upstream proxy on api.ageofempires.com with internet, 404 without it).
Enabled = true

# Folder where the files are stored, relative to the server directory. 'auto'
# resolves to the same folder.
Folder = 'resources/custom-files'

# Every enabled game shares this folder and the match ids: a file is addressed
# by the numeric match id alone and the request carries no game marker, so two
# titles playing at the same time can pick the same id and replace each other.

# Maximum size of a single file. Long matches and custom content can make a
# .aoe2mpgame several MB. Accepts B/KB/MB/GB suffixes.
MaxFileSize = '32MB'

# Maximum accumulated size. When exceeded, the oldest files are evicted first.
MaxTotalSize = '256MB'

# How long a custom file is kept since its upload. Accepts Go durations
# (e.g. 12h, 30m, 1h30m). Files are also purged at startup if older than this.
Expiry = '12h'

# CONFIGURING EMBEDDED BATTLE SERVER
# Runs a battle server inside the age server process instead of as a
# separate executable. Configure per game under Games.<game>.EmbeddedBattleServer.
# The server starts the battle server on startup and stops it on shutdown.
# The battle server appears in the game's battle server list like any
# external battle server.
#
# STARTIFMISSING: Controls when the embedded battle server auto-starts if no
# external battle server is configured ([[Games.<game>.BattleServers]]) and none
# is detected by the battle-server-manager. Accepted values:
#   "true" (default): always start if missing
#   "false": never auto-start
#   "required": start if missing for age4/athens, otherwise false
# [Games.age1.EmbeddedBattleServer]
# StartIfMissing = "true"
# Region = 'my-embedded-server'
# Name = 'Embedded Battle Server'
# IPv4 = 'auto'
# BsPort = 0
# WebSocketPort = 0
# OutOfBandPort = 0
# LogLevel = 'info'
#
# The simulation period is not configurable here: each game always runs with
# its own default (25 ms for AoE: DE, 50 for AoE III: DE and AoM: RT, 125 for
# AoE II: DE and AoE IV: AE).

# CONFIGURING REPLAYS
# Replays uploaded by the game are stored in
# <resources>/responses/cloud/<game>/replays. The folder is not configurable.
[Replays]
# Whether to accept replay uploads.
Enabled = true

# Maximum size of a single replay file. Accepts B/KB/MB/GB suffixes.
MaxFileSize = '32MB'

# Maximum accumulated size per game. When exceeded, the oldest replays are
# evicted first. Files under builtin/ are never evicted.
MaxTotalSize = '1GB'

# How long a replay is kept since its last write. Accepts Go durations
# (e.g. 12h, 30m, 1h30m). Files are also purged at startup if older than this.
# Set to 0 or a negative value (e.g. -1) to keep replays forever.
Expiry = '-1s'

# CONFIGURING THE API TREE
[Api]
# Whether this server serves the public Age of Empires API on its hosts: the
# mods API and the /api/MatchContent/ endpoints. With it disabled those paths
# answer 404 here, without the embedded library and without forwarding them to
# the official service. It cannot be disabled while [Mods] Enabled is true.
Enabled = true

# CONFIGURING THE MODS API
# Serves /api/v4/Mods/..., /api/v1/Mods/... and /Poll/... on the Age of Empires
# hosts with the embedded ageAPIServer library and its own SQLite database,
# instead of forwarding them to the official service. Without internet those
# paths used to answer 404; with it they keep working as before.
#
# Mods are shared by every enabled game: the API selects them by gameTitleId.
# The Steam ticket is not verified cryptographically, so an install reachable
# from outside the LAN trusts whatever well-formed ticket a client sends.
[Mods]

# Whether to serve the mods API. When disabled the paths keep their previous
# behaviour: the host proxy forwards them upstream when there is internet.
# When enabled, the upstream is used only with internet and an official
# client; otherwise the local answer wins. A client is official unless its
# Steam1.0 ticket can be decoded (gbe_fork emits plaintext tickets while a
# real Steam ticket is opaque). A request without that header is treated as
# official, so with internet it is forwarded upstream. The same condition
# governs the /api/MatchContent/ endpoints: an official client keeps the
# official savegame exchange too.
# The same instance serves the /api/MatchContent/ endpoints; their settings
# are in [CustomFiles] and it is built when either section is enabled.
Enabled = true

# SQLite file of the mods API, relative to the server directory. 'auto'
# resolves to the same path.
DBPath = 'resources/mods/mods.db'

# Folder for the archives and screenshots uploaded to Publish, relative to the
# server directory. 'auto' resolves to the same folder.
UploadDir = 'resources/mods/uploads'

# Maximum size of a single mods request. A mod archive is measured in megabytes,
# so this also raises the body cap the HTTP server applies. Accepts B/KB/MB/GB.
# MaxUploadSize = '256MB'

# Whether the endpoints the specification declares anonymous reject requests
# without credentials. Off keeps the specification.
# RequireAuthForRead = false
