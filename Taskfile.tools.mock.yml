# yaml-language-server: $schema=https://taskfile.dev/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: '3'

tasks:
  build-launcher:
    internal: true
    env:
      GOOS: windows
      GOARCH: amd64
    run: when_changed
    sources:
      - common/**/*
      - tools/mock/launcher/**/*
    generates:
      - build/mock/game/{{.GAME_ID}}/launcher.exe
    method: checksum
    cmds:
      - go build -ldflags="-X 'launcher/internal/cmd.executableGame={{.GAME_BIN_NAME}}.exe'" -o build/mock/game/{{.GAME_ID}}/launcher.exe ./tools/mock/launcher
  build-game:
    internal: true
    env:
      GOOS: windows
      GOARCH: amd64
    run: when_changed
    sources:
      - common/**/*
      - tools/mock/game/**/*
    generates:
      - build/mock/game/{{.GAME_ID}}/{{.GAME_BIN_NAME}}.exe
    method: checksum
    cmds:
      - go build -o build/mock/game/{{.GAME_ID}}/{{.GAME_BIN_NAME}}.exe ./tools/mock/game
  build-common:
    internal: true
    cmds:
      - task: build-game
        vars: { GAME_ID: '{{.GAME_ID}}', GAME_BIN_NAME: '{{.GAME_BIN_NAME}}' }
      - task: build-launcher
        vars: { GAME_ID: '{{.GAME_ID}}', GAME_BIN_NAME: '{{.GAME_BIN_NAME}}' }
  build-age1:
    cmds:
      - task: build-common
        vars: { GAME_ID: 'age1', GAME_BIN_NAME: 'AoEDE_s' }
  build-age2:
    cmds:
      - task: build-common
        vars: { GAME_ID: 'age2', GAME_BIN_NAME: 'AoE2DE_s' }
      - task: :run
        vars: { PROGRAM: 'createGameMockCA', ARGS: 'age2' }
  build-age3:
    cmds:
      - task: build-common
        vars: { GAME_ID: 'age3', GAME_BIN_NAME: 'AoE3DE_s' }
      - task: :run
        vars: { PROGRAM: 'createGameMockCA', ARGS: 'age3' }
  build-age4:
    cmds:
      - task: build-common
        vars: { GAME_ID: 'age4', GAME_BIN_NAME: 'RelicCardinal' }
  build-athens:
    cmds:
      - task: build-common
        vars: { GAME_ID: 'athens', GAME_BIN_NAME: 'AoMRT_s' }
      - task: :run
        vars: { PROGRAM: 'createGameMockCA', ARGS: 'athens' }