# yaml-language-server: $schema=https://taskfile.dev/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: '3'

tasks:
  # Start of prepare tasks
  prepare-server-genCert:
    sources:
      - server/resources/**/*
    generates:
      - build/server/resources/**/*
    method: checksum
    cmds:
      - task: :tools:run
        vars: { PROGRAM: 'copyServerResources' }
  prepare-server:
    deps:
      - prepare-server-genCert
      - build-genCert
    cmds:
      - build/server/bin/genCert{{exeExt}} -r
  ensure-certificate:
    deps:
      - prepare-server-genCert
      - build-genCert
    sources:
      - common/**/*
      - server-genCert/**/*
    generates:
      - build/server/bin/genCert{{exeExt}}
      - build/server/resources/certificates/**/*
    method: checksum
    vars:
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - build/server/bin/genCert{{exeExt}} -i {{.ARGS}}
  prepare-launcher:
    deps:
      - prepare-battle-server-manager
      - build-server
      - build-launcher-agent
      - build-battle-server-manager
      - os:prepare-launcher
    sources:
      - common/**/*
      - launcher-common/**/*
      - launcher/**/*
    generates:
      - build/launcher/resources/**/*
      - build/launcher/launcher{{exeExt}}
    method: checksum
    cmds:
      - task: :tools:run
        vars: { PROGRAM: 'copyLauncherResources' }
  prepare-battle-server-manager:
    deps: [ ensure-certificate ]
    sources:
      - common/**/*
      - battle-server-manager/**/*
    generates:
      - build/battle-server-manager/resources/**/*
    method: checksum
    cmds:
      - task: :tools:run
        vars: { PROGRAM: 'copyBattleServerManagerResources' }
      - task: os:build-config-helper-amd64
      - task: os:build-config-helper-arm64
  # Start of build tasks
  build-server:
    sources:
      - common/**/*
      - server/**/*
    generates:
      - build/server/server{{exeExt}}
    method: checksum
    cmds:
      - go build -o build/server/server{{exeExt}} ./server
  build-genCert:
    sources:
      - common/**/*
      - server-genCert/**/*
    generates:
      - build/server/bin/genCert{{exeExt}}
    method: checksum
    cmds:
      - go build -o build/server/bin/genCert{{exeExt}} ./server-genCert
  build-battle-server-manager:
    sources:
      - common/**/*
      - battle-server-manager/**/*
    generates:
      - build/battle-server-manager/battle-server-manager{{exeExt}}
    method: checksum
    cmds:
      - go build -o build/battle-server-manager/battle-server-manager{{exeExt}} ./battle-server-manager
  build-config:
    sources:
      - common/**/*
      - launcher-common/**/*
      - launcher-config/**/*
    generates:
      - build/launcher/bin/config{{exeExt}}
    method: checksum
    cmds:
      - go build -o build/launcher/bin/config{{exeExt}} ./launcher-config
  build-launcher-agent:
    deps:
      - build-config-all
    sources:
      - common/**/*
      - launcher-common/**/*
      - launcher-agent/**/*
    method: checksum
    generates:
      - build/launcher/bin/agent{{exeExt}}
    cmds:
      - go build -o build/launcher/bin/agent{{exeExt}} ./launcher-agent
  build-config-admin:
    sources:
      - common/**/*
      - launcher-common/**/*
      - launcher-config-admin/**/*
    generates:
      - build/launcher/bin/config-admin{{exeExt}}
    method: checksum
    cmds:
      - go build -o build/launcher/bin/config-admin{{exeExt}} ./launcher-config-admin
  build-config-admin-agent:
    deps: [ build-config-admin ]
    sources:
      - common/**/*
      - launcher-common/**/*
      - launcher-config-admin-agent/**/*
    generates:
      - build/launcher/bin/config-admin-agent{{exeExt}}
    method: checksum
    cmds:
      - go build -o build/launcher/bin/config-admin-agent{{exeExt}} ./launcher-config-admin-agent
  build-config-all:
    deps: [ build-config, build-config-admin-agent ]
  build-gui-config:
    summary: Builds the Wails GUI configuration application
    dir: gui/server/config
    cmds:
      - task build
includes:
  os: ./Taskfile.debug.{{if eq OS "windows"}}other{{else}}unix{{end}}.yml