name: goreleaser

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            go.work.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: gui/server/config/frontend/package-lock.json
      - name: Build frontend
        run: |
          cd gui/server/config/frontend
          npm ci
          npm run build
      - name: Set up Go legacy
        id: setup_go_legacy
        run: |
          dir="${{ vars.GOROOT_LEGACY }}"
          version="1.27.4-1"
          subdir="go-legacy-win7"
          curl -L https://github.com/thongtech/$subdir/releases/download/v$version/$subdir-$version.linux_amd64.tar.gz -o go.tar.gz
          sudo mkdir -p "$dir"
          sudo tar -C "$dir" --strip-components=1 -xzf go.tar.gz
          rm go.tar.gz
          echo "goroot=$dir/$subdir" >> $GITHUB_OUTPUT
      - name: Generate Goreleaser config
        shell: bash
        run: |
          go tool generateGoreleaserConfig "${{ steps.setup_go_legacy.outputs.goroot }}"
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.20.2'
          args: release --fail-fast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GoReleaser otherwise derives the tag from `git tag --points-at HEAD`
          # sorted with -version:refname, which returns a prerelease tag first
          # when a release and its rc point at the same commit (v2.0.0 vs
          # v2.0.0-rc.1). Pin it to the tag that triggered this run.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
