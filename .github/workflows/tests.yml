name: "Tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  go-test:
    name: go test (${{ matrix.module }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        module:
          - common
          - launcher-common
          - launcher-config-admin
          - launcher-config
          - launcher-agent
          - launcher-config-admin-agent
          - server
          - battle-server-manager
          - tools/scripts
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1

  go-test-race:
    name: go test -race (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - common
          - server
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - name: Test with race detector
        run: go test ./... -count=1 -race
