[Config]
# Whether to add a local dns entry if it's needed to connect to the server with the official domain.
# Including to avoid receiving that it's on maintenance.
# If using '{HostFilePath}' in 'Client.ExecutableArgs', this will be ignored.
# Note: Will require admin privileges.
CanAddHost = true
# Whether to broadcast the game BattleServer to all interfaces in LAN (not just the most priority one).
# Either 'auto' or 'false'. This is only necessary in Windows when not running AoM nor AoE IV, on the rest of systems it is always 'false'.
CanBroadcastBattleServer = 'auto'
# Whether to log all the info the terminal plus more info to a file. Enable it for errors.
Log = false
# Whether to ask the interactive questions in a graphical window instead of in the console.
# Note: graphical dialogs are always available in Windows and macOS. In Linux-like systems
# they require 'qarma', 'zenity' or 'matedialog' to be installed.
CanUseDialogs = true
# Whether or not the launcher may use the internet to look up official domains.
# If false, only the statically known domains will be used for the hosts file,
# certificates and logs. If true and there is no internet connectivity the launcher
# will still work with the statically known domains.
CanUseInternet = true

[Config.Certificate]
# Whether or not to trust the certificate of the server in user or local store, or not at all.
# auto: resolves to 'user' in macOS and 'local' in the other systems.
# local: trust the certificate in the local store. Requires admin rights. Requires user consent in macOS.
# user: trust the certificate in the user store. Requires user consent. Unavailable in Linux.
# false: do not trust the certificate. You will have to trust it manually in the proper store.
# If using '{CertFilePath}' in 'Client.ExecutableArgs', this will be ignored.
CanTrustInPc = 'auto'
# Whether to trust the certificate of the server in the game's certificate store.
# Required for all games except AoE I: DE and AoE IV: AE.
# false: do not trust the certificate. You will have to trust it manually if the game needs it.
# true: trust the certificate in the game's certificate store.
# Requires 'Client.Path' to be resolved properly.
CanTrustInGame = true

[Server]
# Whether to start the server automatically or 'auto', which will start the server if no server is found in the LAN
# 'auto' depend on the Announce setting in the server config being true to find servers.
Start = 'auto'
# Whether to stop it automatically, if 'auto', it will stop the server if Start = true (or 'auto' does not find a server)
# This will also stop the Battle Server if one was started with the Battle Server Manager.
Stop = 'auto'
# Whether to select automatically the server if only one was discovered.
# Not recommended to be set to true if users connect using the official game launcher.
SingleAutoSelect = false
# Whether to start the server automatically without user confirmation when Start is 'auto' and no server is found.
StartWithoutConfirmation = false
# The process to start the server, if 'auto', it will be try to execute the server binary in this directory order:
# 1. './server/'
# 2. '../server/'
# 3. '../../server/'
# Note: You may use environment variables.
Executable = 'auto'
# The arguments to pass to the server executable if starting it. Execute the server help flag for available arguments.
# {Game} will be replaced by the game name. Default, only start the server for the given name.
# {Id} will be replaced by a random unique server id (UUID v4).
# {StartBsIfMissing} will be replaced by the embedded battle server StartIfMissing mode for all enabled games (true, false, required).
# When 'Config.Log' is true '-l', '--flatLog', '--logRoot' and '--deterministic' arguments will be passed.
# Windows: Path names need to use double backslashes within single quotes or be within double quotes.
# Note: You may use environment variables.
ExecutableArgs = ['-e', '{Game}', '--id', '{Id}', '--startBsIfMissing', '{StartBsIfMissing}']
# The host of the server to connect to if Start = false, if Start = true/auto this will be ignored
# The host may be a DNS name or Ipv4 IP. 0.0.0.0 means every local interface IP.
# Note: See the server config to set the interface to bind to.
Host = '0.0.0.0'
# Announce ports to listen to. If not including the default port, default configured servers will not get discovered.
AnnouncePorts = [31978]
# Announce multicast group adresses to join.
# If not including the default group, default configured servers will not get discovered via Multicast.
# Only IPv4 is supported.
AnnounceMulticastGroups = ['239.31.97.8']

# This section only applies if starting the server.
[Server.BattleServerManager]
# When to use the manager to start a new Battle Server running the manager; accepted values:
# 'required': Only for when it is required for it to work ('steam' on macOS and AoM: RT and AoE IV: AE for all platforms).
# 'true'.
# 'false'.
# Note: by default the manager will only start a new instance if one is not already running for the given game.
# Important: This should be false if you already have a static BattleServer configured in the server config.
Run = 'false'
# The process to start the battle-server-manager,
# if 'auto', it will be try to execute the server binary in this directory order:
# 1. './battle-server-manager/'
# 2. '../'
# 3. '../battle-server-manager/'
# Note: You may use environment variables.
Executable = 'auto'
# The arguments to pass to the Battle Server Manager executable if starting it.
# Execute the manager help flag for available arguments.
# {Game} will be replaced by the game name.
# By default, it will also hide the BattleServer.exe window (apart from the manager itself).
# Note: You may use environment variables.
ExecutableArgs = ['-e', '{Game}', '-r']
